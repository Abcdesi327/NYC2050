      x0=Math.min(x0,Math.max(m.p[0],cx-hw*1.3)); x1=Math.max(x1,Math.min(m.p[0],cx+hw*1.3));
      y0=Math.min(y0,Math.max(m.p[1],cy-hh*1.3)); y1=Math.max(y1,Math.min(m.p[1],cy+hh*1.3));
    });
    return (box=[x0,y0,x1,y1]);
  }
  function fit(){
    const w=svg.clientWidth||innerWidth, h=svg.clientHeight||innerHeight;
    const [x0,y0,x1,y1]=extent();
    const insetL=20,insetR=70,insetT=66,insetB=20;
    const availW=Math.max(80,w-insetL-insetR), availH=Math.max(80,h-insetT-insetB);
    sc=Math.max(0.01,Math.min(2,Math.min(availW/(x1-x0),availH/(y1-y0))));
    tx=insetL+(availW-(x1-x0)*sc)/2-x0*sc;
    ty=insetT+(availH-(y1-y0)*sc)/2-y0*sc;
    apply();
  }
  function zoomAt(f,cx,cy){
    const ns=Math.max(0.02,Math.min(3,sc*f));
    const k=ns/sc; tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; sc=ns; apply();
  }
  function toMap(clientX,clientY){
    const r=svg.getBoundingClientRect();
    return [(clientX-r.left-tx)/sc,(clientY-r.top-ty)/sc];
  }
  const ptrs=new Map(); let last=null,pd=0,moved=0;
  stage.addEventListener("pointerdown",e=>{
    stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    moved=0; if(ptrs.size===1) last={x:e.clientX,y:e.clientY};
    if(ptrs.size===2){const[a,b]=[...ptrs.values()];pd=Math.hypot(a.x-b.x,a.y-b.y);}
  });
  stage.addEventListener("pointermove",e=>{
    if(!ptrs.has(e.pointerId))return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1&&last){
      const dx=e.clientX-last.x, dy=e.clientY-last.y;
      moved+=Math.abs(dx)+Math.abs(dy);
      tx+=dx; ty+=dy; last={x:e.clientX,y:e.clientY}; apply();
    } else if(ptrs.size===2){
      const [a,b]=[...ptrs.values()], nd=Math.hypot(a.x-b.x,a.y-b.y);
      if(pd>0) zoomAt(nd/pd,(a.x+b.x)/2,(a.y+b.y)/2);
      pd=nd; moved+=6;
    }
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>
    stage.addEventListener(ev,e=>{ptrs.delete(e.pointerId);
      if(ptrs.size<2)pd=0; if(ptrs.size===0)last=null;}));
  stage.addEventListener("wheel",e=>{e.preventDefault();
    zoomAt(Math.pow(0.9986,e.deltaY),e.clientX,e.clientY);},{passive:false});
  /* One hit test for the whole plate, in map space. Hanging a listener on each symbol
     looks tidier and does not survive the pointer capture the pan uses — the click
     arrives at the stage, not at the mark. A named place wins over the block it stands
     on, within the radius its symbol is actually drawn at. */
  stage.addEventListener("click",e=>{
    if(moved>6) return;
    const p=toMap(e.clientX,e.clientY);
    const m=markAt(p,SYM_PX*0.85/sc);
    if(m) { showMark(m); return; }
    const b=blockAt(p);
    if(b) showBlock(b); else hideRead();
  });
  fit();
  return {fit:fit,apply:apply,zoomAt:zoomAt,toMap:toMap,
    repaint(){paintBlocks(L.block);},
    get scale(){return sc;}};
}

function markAt(p,radius){
  let best=null,bd=Infinity;
  city.landmarks.forEach(m=>{
    const d=Math.hypot(m.p[0]-p[0],m.p[1]-p[1]);
    if(d<bd){bd=d;best=m;}
  });
  return bd<=radius?best:null;
}
function blockAt(p){
  let best=null,bd=Infinity;
  city.blocks.forEach(b=>{
    const d=Math.hypot(b.c[0]-p[0],b.c[1]-p[1]);
    if(d<bd){bd=d;best=b;}
  });
  if(!best||bd>320) return null;
  return inside(best.poly,p)?best:(bd<90?best:null);
}
function inside(poly,p){
  let hit=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i],b=poly[j];
    if((a[1]>p[1])!==(b[1]>p[1])&&
       p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0]) hit=!hit;
  }
  return hit;
}

/* =================================================================================== */
/*  reading the plate                                                                  */
/* =================================================================================== */
function hideRead(){ q("cpRead").classList.remove("on"); sel=null; }
function showBlock(b){
  sel=b;
  const u=A.city.USES[b.use];
  q("cpRNm").textContent=u.label;
  q("cpRMeta").textContent=
    Math.round(b.area).toLocaleString()+" m² of ground · "+
    Math.round(b.coverage*100)+"% built · "+b.storeys+" storey"+(b.storeys===1?"":"s")+
    " · "+Math.round(b.floor).toLocaleString()+" m² of floor";
  const code=q("cpRCode");
  code.textContent=b.use.toUpperCase(); code.style.background=u.colour;
  const dens=b.people/(b.area/10000);
  q("cpRNote").textContent=
    (b.people>0?b.people.toLocaleString()+" people live on this block, "+
      Math.round(dens)+" to the hectare. ":"Nobody lives on this block. ")+
    (b.toWater<300?"It stands "+Math.round(b.toWater)+" m from the water. ":"")+
    Math.round(Math.hypot(b.c[0]-city.plan.centre[0],b.c[1]-city.plan.centre[1]))+
    " m from the "+(city.archetype==="crossing"?"Temple Rock":"Staple")+", "+
    (b.r<city.S.wallR?"inside":"outside")+" the wall"+
    (b.sacred?", inside the interdict":"")+
    (b.onWay?", on the through-way":"")+
    (b.onRoad&&!b.onWay?", on a road out":"")+
    ". Generated fabric, not a surveyed street.";
  q("cpRead").classList.add("on");
}
function showMark(m){
  q("cpRNm").textContent=m.name;
  q("cpRMeta").textContent=(m.kind==="gate"?"GATE OF THE WALL":m.kind.toUpperCase())+
    " · "+Math.round(Math.hypot(m.p[0]-city.plan.staple[0],
      m.p[1]-city.plan.staple[1])).toLocaleString()+" m from the Staple";
  const code=q("cpRCode");
  code.textContent=(MARK[m.kind]||MARK.civic).sym==="anchor"?"HARBOUR":m.kind.toUpperCase();
  code.style.background=(MARK[m.kind]||MARK.civic).col;
  q("cpRNote").textContent=m.note;
  q("cpRead").classList.add("on");
}

/* =================================================================================== */
/*  the key and the account                                                            */
/* =================================================================================== */
function fillKey(){
  let h="";
  if(blockMode==="use"){
    h+="<b>THE FABRIC — BY USE</b>";

  } else if(blockMode==="storeys"){
    h+="<b>THE FABRIC — BY STOREYS</b>"+
      '<i style="background:#E3DCC4"></i>NONE OR ONE<br>'+
      '<i style="background:#C0AE82"></i>TWO<br>'+
      '<i style="background:#A99167"></i>THREE<br>'+
      '<i style="background:#8E7550"></i>FOUR<br>'+
      '<i style="background:#71593B"></i>FIVE<br>';
  } else {
    h+="<b>THE FABRIC — BY DENSITY</b>"+
      '<span style="display:inline-block;vertical-align:-2px;margin-right:6px">'+
      ["#EFE9D6","#DED2AE","#CBB585","#B69561","#9B7444","#7C542F","#5C3922"]
        .map(c=>'<i style="background:'+c+';width:9px;margin:0;border-radius:0"></i>').join("")+
      '</span>0 → 770 A HECTARE<br>';
  }
  h+='<b>ON THE PLATE</b>'+
    '<i style="background:'+STREET.quay+'"></i>QUAY &nbsp;'+
    '<i style="background:'+STREET.great+'"></i>GREAT STREET<br>'+
    '<i style="background:'+STREET.ring+'"></i>RING &nbsp;'+
    '<i style="background:'+STREET.minor+'"></i>MINOR<br>'+
    '<i style="background:#4A463C"></i>THE WALL, ITS TOWERS AND GATES<br>'+
    (city.inner?'<i style="background:#6B5A82"></i>THE INTERDICT WALL · '+
      'CONSECRATED GROUND<br>'+
      '<i style="background:#6E5A34"></i>THE THROUGH-WAY, AND IN RED THE LINE IT '+
      'WOULD TAKE IF IT COULD<br>':'')+
    '<i style="background:url(#reed) #A8B99B"></i>MARSH AND THE SALT PANS<br>'+
    '<b>KEYS</b>F FABRIC &nbsp; K KEY &nbsp; ESC OUT';
  q("cpKey").innerHTML=h;
}

/* How much of the continent's overland trade actually passes through this cell. Seventeen
   least-cost trees, so it is worked out when the account is first opened and not before. */
let betCache=null;
function pairsThrough(cell){
  if(betCache) return betCache.of(cell);
  /* Count only the pairs a burg lies strictly between — a road that ends at a place
     does not pass through it — and count every burg in the same seventeen trees, so
     "more than anywhere else" can be checked rather than asserted. */
  const cells=A.data.markets.map(m=>m.cell);
  const between=new Map(), touching=new Map();
  A.burgs.forEach(b=>{ between.set(b.cell,0); touching.set(b.cell,0); });
  const bump=(m,k)=>{ if(m.has(k)) m.set(k,m.get(k)+1); };
  let total=0;
  for(let x=0;x<cells.length;x++){
    const {dist,prev}=A.route.from(cells[x]);
    for(let y=x+1;y<cells.length;y++){
      const a=cells[x], b=cells[y];
      if(!isFinite(dist[b])) continue;
      total++;
      bump(touching,a); bump(touching,b);
      for(let n=prev[b];n>=0&&n!==a;n=prev[n]){ bump(between,n); bump(touching,n); }
    }
  }
  const order=m=>[...m.entries()].sort((p,q)=>q[1]-p[1]);
  const rB=order(between), rT=order(touching);
  const nameOf=c=>(A.burgOf(c)||{}).name||"—";
  betCache={
    of(c){
      const iB=rB.findIndex(r=>r[0]===c), iT=rT.findIndex(r=>r[0]===c);
      return {
        cell:c, total:total, burgs:A.burgs.length,
        between:between.get(c)||0, betweenRank:iB+1,
        betweenLeader:rB[0]?nameOf(rB[0][0]):null, betweenLeaderN:rB[0]?rB[0][1]:0,
        touching:touching.get(c)||0, touchingRank:iT+1,
        touchingLeader:rT[0]?nameOf(rT[0][0]):null
      };
    }
  };
  return betCache.of(cell);
}

/* How far the land runs before the sea stops it, on the four winds. */
function neckOf(cell){
  const C=A.cells, out={};
  [["north",-90],["south",90],["east",0],["west",180]].forEach(([nm,deg])=>{
    const dx=Math.cos(deg*Math.PI/180), dy=Math.sin(deg*Math.PI/180);
    let d=0;
    for(;d<420;d+=4) if(!A.isLand(A.cellAt(C.x[cell]+dx*d,C.y[cell]+dy*d))) break;
    out[nm]=d>=420?null:Math.round(d*A.meta.scale);
  });
  return out;
}

let acctFor=null;
function fillAccount(force){
  if(!force&&acctFor===city) return;
  acctFor=city;
  const s=city.stats, st=city.site, doc=city.doctrine;
  const row=(k,v)=>'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>';
  const pc=n=>Math.round(n/s.population*100)+"%";

  let h='<dl class="acct">'+
    row("People",s.population.toLocaleString())+
    row("Within the wall",s.inside.toLocaleString()+" ("+pc(s.inside)+")")+
    (city.archetype==="crossing"?
      row("In the strangers' wards",s.wardPeople.toLocaleString()+" ("+
        pc(s.wardPeople)+")"):
      row("In the suburbs",s.outside.toLocaleString()))+
    row("Built ground",Math.round(s.areaHa).toLocaleString()+" ha")+
    row("Intramural",Math.round(s.wallHa).toLocaleString()+" ha")+
    (city.archetype==="crossing"?
      row("Consecrated ground",Math.round(s.sacredHa).toLocaleString()+" ha")+
      row("Ground on the way",Math.round(s.wayHa).toLocaleString()+" ha"):"")+
    row("Density in / out",Math.round(s.densityInside)+" / "+
      Math.round(s.densityOutside)+" a hectare")+
    row("Blocks",s.blocks.toLocaleString())+
    row("Streets",s.streets.toLocaleString())+
    (city.archetype==="crossing"?
      row("The through-way",Math.round(s.corridorM).toLocaleString()+" m")+
      row("Straight between its gates",Math.round(s.gateGapM).toLocaleString()+" m")+
      row("The detour",s.detour.toFixed(2)+"× — "+
        Math.round(s.corridorM-s.gateGapM).toLocaleString()+" m of extra road")+
      row("Wall",s.wallGates+" gates, "+s.innerGates+" posterns"):
      row("Quay",Math.round(s.quayM).toLocaleString()+" m")+
      row("Wall",s.wallGates+" gates, "+s.wallTowers+" towers"))+
    '</dl>';

  /* ---- what the export says ---- */
  h+='<p class="grp">WHAT THE EXPORT SAYS</p><ul class="why">';
  const why=[];
  if(city.archetype==="crossing"){
    const trunks=st.roads.filter(r=>r.cls==="trunk").sort((a,b)=>b.uses-a.uses);
    const b=pairsThrough(st.cell), neck=neckOf(st.cell);
    let widest=0;
    for(let i=0;i<trunks.length;i++) for(let j=i+1;j<trunks.length;j++)
      widest=Math.max(widest,Math.abs(((trunks[i].bearing-trunks[j].bearing+540)%360)-180));
    why.push(["Two trunk roads, "+Math.round(widest)+"° apart",
      "the only market on the sheet with more than one — so this is a road with a "+
      "city on it, and it is laid out that way round"]);
    trunks.forEach(t=>why.push([
      "The "+(t.leadsTo||"trunk")+" road leaves "+bear(t.bearing),
      t.uses+" of the "+A.data.report.market_pairs+" market pairs"+
      (t.leadsTo?", reaching "+t.leadsTo+" in "+t.leadsIn+" after "+t.leadsHops+
        " cells":"")]));
    why.push([b.touching+" of "+b.total+" reachable market pairs touch this place",
      Math.round(b.touching/b.total*100)+" per cent of every overland trade on the "+
      "sheet — "+(b.touchingRank===1?("first of the "+b.burgs+" burgs in Adrinem"):
        ("ranked "+b.touchingRank+" of "+b.burgs+", behind "+b.touchingLeader))]);
    why.push([b.between+" of them are only passing through",
      "counting the pairs it lies between and not the ones it is an end of, which "+
      (b.betweenRank===1?("is more than anywhere else in Adrinem"):
        ("puts it "+b.betweenRank+" of "+b.burgs+", behind "+b.betweenLeader+" on "+
         b.betweenLeaderN+" — its own neighbour on the same trunk"))+
      ". That is the traffic the city has to move and cannot sell to."]);
    if(neck.north!=null||neck.south!=null)
      why.push(["The land runs out "+
        [neck.north!=null?neck.north+" mi north":null,
         neck.south!=null?neck.south+" mi south":null].filter(Boolean).join(" and "),
        "and continues past the edge of the search east and west — this is a neck, "+
        "and the road has nowhere else to be"]);
    why.push(["The sea lies "+bear(st.seaBearing)+", harbour "+st.harbour,
      "two sea contacts and no shelter worth the name, so the sea is the lesser road "+
      "here and the bend goes the other way"]);
  } else {
    why.push(["The sea lies "+bear(st.seaBearing),
      "cell "+st.cell+" touches exactly one water cell, and that is the bearing of it"]);
    why.push(["The haven has one mouth","harbour value "+st.harbour+
      " — one sea contact, so a basin that is entered and not sailed through"]);
    why.push(["The town is on the "+dirOf(st.landBearing)+" shore",
      "that is where the hinterland is; on the other shore every road out would cross "+
      "the harbour"]);
    st.roads.forEach(r=>why.push([
      (r.leadsTo||"A road")+" arrives "+bear(r.bearing),
      r.cls+", carrying "+r.uses+" of the "+A.data.report.market_pairs+" market pairs"]));
  }
  why.push(["No river, so cisterns",
    "r=0 on this cell and on every cell that touches it"]);
  if(st.riseBearing!=null) why.push(["The ground rises "+bear(st.riseBearing),
    "the highest neighbouring cell, height "+st.riseHeight+" against "+st.height+
    " here — "+(city.archetype==="crossing"?"the quarries and the sulphur climb it":
      "the citadel sits on it")]);
  if(st.marshBearing!=null) why.push(["The marsh is "+bear(st.marshBearing),
    "the neighbouring Wetland cell is that way, and so is everything that stinks"]);
  why.push(["The biome is "+st.biome,
    st.biome==="Volcanic"?"so the city is quarried out of its own hill and there is "+
      "nothing else here worth building with":"which is what the going costs are "+
      "priced from"]);
  why.push(["The wall is "+Math.round(city.S.wallR).toLocaleString()+" m out",
    "the radius enclosing three-quarters of the people, solved rather than chosen"]);
  why.forEach(([a,b])=>h+='<li><b>'+esc(a)+'</b><span>'+esc(b)+'</span></li>');
  h+='</ul>';

  /* ---- and what it does not ---- */
  if(doc){
    h+='<p class="grp">THE DOCTRINE — NOT FROM THE EXPORT</p>'+
      '<p class="empty">The map file says nothing about religion. '+esc(doc.name)+
      ' is the author\'s, stated as a premise; these are the things on the plate that '+
      'follow from it rather than from the data.</p><ul class="why">';
    const dw=[
      ["The plan is struck from the sanctuary","not from a market — "+
        Math.round(s.sacredHa).toLocaleString()+" ha of consecrated ground inside a "+
        "wall of its own, with "+s.innerGates+" posterns and no gate a waggon can use"],
      ["The through-way is bent round it","the road may not cross the precinct, so it "+
        "runs "+s.detour.toFixed(2)+"× the straight line between its own gates — "+
        Math.round(s.corridorM-s.gateGapM).toLocaleString()+
        " metres of extra road on every crossing of Adrinem made by land"],
      ["The strangers sleep outside","no stranger may lodge on consecrated ground, so "+
        s.wardPeople.toLocaleString()+" people — "+pc(s.wardPeople)+
        " of the city — live in two wards at the ends of the way"],
      ["The named trades are exiled","tanning and slaughter go beyond the wall by "+
        "doctrine rather than by wind, which is why they are on the lesser road and "+
        "not downwind"]
    ];
    dw.forEach(([a,b])=>h+='<li><b>'+esc(a)+'</b><span>'+esc(b)+'</span></li>');
    h+='</ul>';
  }

  /* ---- the reachable world ---- */
  h+='<p class="grp">WHAT IT CAN REACH</p><ul class="why">';
  st.seaOnly.forEach(m=>h+='<li><b>'+esc(m.name)+' · '+m.pop.toLocaleString()+
    '</b><span>'+esc(m.state)+' — no overland way at any price</span></li>');
  st.overland.slice(0,5).forEach(m=>h+='<li><b>'+esc(m.name)+' · '+
    m.pop.toLocaleString()+'</b><span>'+Math.round(m.cost).toLocaleString()+
    ' effective miles, '+Math.round(m.cost/A.meta.supplyDivisor)+' days over land</span></li>');
  h+='</ul>';

  h+='<p class="empty">The head count is the export\u2019s. Everything else on this '+
    'plate is generated from the site by the rules above — no street here was '+
    'surveyed, and none of it is a claim about what is there.</p>';
  q("cpAcct").innerHTML=h;
}
const COMPASS=["east","south-east","south","south-west","west","north-west","north",
  "north-east"];
function dirOf(deg){
  return deg==null?"nowhere":COMPASS[(Math.round(((deg%360)+360)%360/45))%8];
}
function bear(deg){ return deg==null?"nowhere":"to the "+dirOf(deg); }

/* =================================================================================== */
/*  open and close                                                                     */
/* =================================================================================== */
function open(cell){
  const host=q("cityPlate");
  host.classList.add("on");
  q("cpName").textContent=(A.burgOf(cell)||{name:"…"}).name;
  q("cpSub").textContent="LAYING OUT THE GROUND…";
  /* let the panel paint before the generator takes the thread */
  setTimeout(()=>{
    const t0=performance.now();
    city=A.city.generate(cell);
    const ms=Math.round(performance.now()-t0);
    if(!city){ host.classList.remove("on"); return; }
    const st=city.site;
    q("cpName").textContent=st.name;
    q("cpSub").textContent=
      st.province.toUpperCase()+" · "+st.state.toUpperCase()+" · "+
      st.pop.toLocaleString()+" PEOPLE · HARBOUR "+st.harbour+" · "+
      city.stats.blocks.toLocaleString()+" BLOCKS GENERATED IN "+ms+" MS";
    draw(city);
    fillKey(); acctFor=null; q("cpAcct").innerHTML=""; hideRead();
    if(window.TOUR) window.TOUR.maybePlate();
  },30);
}
function close(){ q("cityPlate").classList.remove("on"); }

function boot(){
  q("cpClose").onclick=close;
  q("cpReadX").onclick=hideRead;
  q("cpKeyBtn").onclick=()=>{
    const on=q("cpKey").classList.toggle("on");
    q("cpKeyBtn").setAttribute("aria-pressed",String(on));
  };
  q("cpAcctBtn").onclick=()=>{
    const on=q("cpAcct").classList.toggle("on");
    q("cpAcctBtn").setAttribute("aria-pressed",String(on));
    if(on){ q("cpAcct").innerHTML='<p class="empty">Working out how much of the '+
      'continent goes through here…</p>';
      setTimeout(()=>fillAccount(),20); }
  };
  const modes=["use","storeys","density"];
  q("cpFabBtn").onclick=()=>{
    blockMode=modes[(modes.indexOf(blockMode)+1)%modes.length];
    q("cpFabBtn").textContent=blockMode==="use"?"USE":blockMode==="storeys"?"HGT":"DENS";
    view&&view.repaint(); fillKey();
  };
  q("cpIn").onclick=()=>view&&view.zoomAt(1.4,innerWidth/2,innerHeight/2);
  q("cpOut").onclick=()=>view&&view.zoomAt(1/1.4,innerWidth/2,innerHeight/2);
  q("cpRst").onclick=()=>view&&view.fit();
  /* While the plate is up it owns the keyboard — the world sheet underneath must not
     also act on the key. Caught on the way down, before the sheet's own listener. */
  addEventListener("keydown",e=>{
    if(!q("cityPlate").classList.contains("on")) return;
    if(e.target.matches("input,textarea")) return;
    e.stopPropagation();
    const k=e.key.toLowerCase();
    if(e.key==="Escape") close();
    else if(k==="f") q("cpFabBtn").click();
    else if(k==="k") q("cpKeyBtn").click();
    else if(k==="a") q("cpAcctBtn").click();
    else if(k==="r") q("cpRst").click();
  },true);
  addEventListener("resize",()=>{ if(view&&q("cityPlate").classList.contains("on")) view.fit(); });
}

A.cityview={open:open, close:close, boot:boot,
  has:cell=>{ const b=A.burgOf(cell); return !!(b&&A.portOf(cell)&&A.marketOf(cell)); }};
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
})();
</script>
<script>
/* ===================================================================================
   Adrinem — application wiring: the plate, the index, search, the way-finder and the
   reader's own marks. The survey sheet's chrome, pointed at another world.
   =================================================================================== */
(function(){
"use strict";
const A=window.ADRINEM;
const C=A.cells, D=A.data, M=A.meta, PAL=A.palette;
const q=id=>document.getElementById(id);

let map=null, sel=null, selPin=null, pinMode=false, editing=null, tab="index";
let pickFor=null;                 /* "from" | "to" when the sheet is being tapped for an end */
let ends={from:null,to:null};
let reachOn=false;

/* ---- the reader's marks, kept in this browser only -------------------------------- */
const KEY="adrinem.marks.v1";
const store={
  all(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } },
  save(v){ try{ localStorage.setItem(KEY,JSON.stringify(v)); }catch(e){} },
  add(p){ const v=store.all(); v.push(p); store.save(v); return p; },
  update(id,patch){ const v=store.all(), r=v.find(p=>p.id===id);
    if(r) Object.assign(r,patch,{isNew:false}); store.save(v); return r; },
  remove(id){ store.save(store.all().filter(p=>p.id!==id)); }
};

/* ---- toast ------------------------------------------------------------------------ */
let toastT=null;
function toast(msg){
  const t=q("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200);
}

/* ---- reading a place off the sheet ------------------------------------------------ */
function coordOf(x,y){
  const lon=A.lonOf(x), lat=A.latOf(y);
  return Math.abs(lat).toFixed(1)+"°"+(lat<0?"S":"N")+" "+
         Math.abs(lon).toFixed(1)+"°"+(lon<0?"W":"E");
}
function describe(i){
  const st=A.stateOf(i), pv=A.provinceOf(i);
  if(!A.isLand(i)) return "OPEN WATER · "+coordOf(C.x[i],C.y[i]);
  return (st==="Neutrals"?"UNCLAIMED":st.toUpperCase())+
    (pv?" · "+pv.toUpperCase():"")+" · "+coordOf(C.x[i],C.y[i]);
}
const miles=n=>Math.round(n).toLocaleString()+" mi";
function daysText(mi){
  const d=A.daysOf(mi);
  return d<1?Math.round(d*24)+" h":d.toFixed(d<10?1:0)+" d";
}

/* ---- the info sheet --------------------------------------------------------------- */
function closeSheet(){ q("sheet").classList.remove("on"); sel=selPin=null;
  map&&map.clearHighlight(); }

function btn(label,cls,fn){
  const b=document.createElement("button");
  b.textContent=label; if(cls) b.className=cls; b.onclick=fn; return b;
}

function showCell(i){
  sel=i; selPin=null;
  const burg=A.burgOf(i), mkt=A.marketOf(i), port=A.portOf(i), bio=A.biomeOf(i);
  q("sNm").textContent = burg ? burg.name : A.isLand(i) ? bio.name : "Open water";
  q("sMeta").textContent = describe(i)+" · CELL "+i;

  const code=q("sCode");
  code.textContent = mkt ? "MARKET CENTRE" : burg ? "SETTLEMENT"
    : A.isLand(i) ? bio.name.toUpperCase() : "SEA";
  code.style.background = mkt?"#7A4A22":burg?"#2C2C2A":PAL.biome(bio.name);
  code.style.color = (mkt||burg)?"var(--paper)":"#2C2C2A";

  const lines=[];
  if(A.isLand(i)){
    lines.push(bio.name+", habitability "+bio.hab+"/100, going "+
      (bio.cost/M.baseCost).toFixed(1)+"× grassland.");
    lines.push("Elevation "+C.h[i]+" of 100. "+A.cultureOf(i)+
      (C.pop[i]>0?", "+C.pop[i].toLocaleString()+" living on this ground":", unpeopled")+".");
    if(burg) lines.push(burg.name+" holds "+burg.pop.toLocaleString()+" of them.");
    if(port) lines.push("Harbour of quality "+port.quality+
      ", the haven lying at cell "+port.haven+"."+
      (A.cityview&&A.cityview.has(i)?
        " A market on a harbour: the ground under it is drawn on its own plate.":""));
    if(C.riv[i]) lines.push("A river runs through it, carrying "+C.flux[i]+" of flux.");
    if(C.mkt[i]>=0){
      const m=A.marketOf(C.mkt[i]);
      lines.push(C.cost[i]<=0 ? "This is the market itself."
        : miles(C.cost[i])+" of effective going to "+(m?m.name:"its market")+
          " — about "+daysText(C.cost[i])+" of supply.");
    } else {
      lines.push("Beyond the reach of every market on the sheet. Nothing on the trade "+
        "network gets here overland.");
    }
  } else {
    lines.push("Sea. The overland network stops at the shore; a crossing from here "+
      "would have to be sailed.");
  }
  q("sNote").textContent=lines.join(" ");

  const acts=q("sActs"); acts.innerHTML="";
  if(A.cityview&&A.cityview.has(i))
    acts.appendChild(btn("◉ CITY PLATE","pri",()=>A.cityview.open(i)));
  acts.appendChild(btn("⌖ CENTRE","",()=>map.flyTo(C.x[i],C.y[i],Math.max(map.scale,4))));
  if(A.isLand(i)){
    acts.appendChild(btn("→ WAY TO","",()=>setEnd("to",i,true)));
    acts.appendChild(btn("← WAY FROM","",()=>setEnd("from",i,true)));
    acts.appendChild(btn("◎ REACH","",()=>runReach(i)));
  }
  acts.appendChild(btn("✎ MARK HERE","",()=>dropMark(C.x[i],C.y[i])));
  q("sheet").classList.add("on");
  map.highlight(i);
}

function showPin(p){
  selPin=p; sel=null;
  const i=A.cellAt(p.x,p.y);
  q("sNm").textContent=p.name;
  q("sMeta").textContent="OWN MARK · "+describe(i);
  const code=q("sCode");
  code.textContent="OWN MARK"; code.style.background="var(--mark)"; code.style.color="#fff";
  q("sNote").textContent=p.note||"No note.";
  const acts=q("sActs"); acts.innerHTML="";
  acts.appendChild(btn("✎ EDIT","pri",()=>openEditor(p)));
  acts.appendChild(btn("⌖ CENTRE","",()=>map.flyTo(p.x,p.y,Math.max(map.scale,4))));
  acts.appendChild(btn("✕ REMOVE","",()=>{
    store.remove(p.id); refreshPins(); closeSheet(); toast("Mark removed"); }));
  q("sheet").classList.add("on");
  map.highlight(i);
}

/* ---- marks ------------------------------------------------------------------------ */
function dropMark(x,y){
  const p={id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    x:x, y:y, name:"", note:"", isNew:true};

function index(){
  const out=[];
  A.burgs.forEach(b=>{
    const mkt=A.marketOf(b.cell);
    out.push({name:b.name, sub:(mkt?"MARKET CENTRE · ":"SETTLEMENT · ")+
      (D.states[b.state]||"Unclaimed").toUpperCase()+" · "+b.pop.toLocaleString(),
      cell:b.cell, zoom:5});
  });
  const seen=new Set();
  for(let i=0;i<A.count;i++){
    if(!A.isLand(i)) continue;
    const st=C.st[i]; if(!st||seen.has("s"+st)) continue;
    seen.add("s"+st);
    out.push({name:D.states[st], sub:"REALM", cell:i, zoom:1.4, realm:st});
  }
  for(let i=0;i<A.count;i++){
    if(!A.isLand(i)||!C.pv[i]) continue;
    const k="p"+C.pv[i]; if(seen.has(k)) continue; seen.add(k);
    out.push({name:D.provinces[C.pv[i]], sub:"PROVINCE OF "+A.stateOf(i).toUpperCase(),
      cell:i, zoom:2.6});
  }
  const cu=new Map();
  for(let i=0;i<A.count;i++){ if(!A.isLand(i)) continue;
    const r=cu.get(C.cu[i])||{x:0,y:0,n:0};
    r.x+=C.x[i]; r.y+=C.y[i]; r.n++; cu.set(C.cu[i],r); }
  cu.forEach((r,k)=>out.push({name:D.cultures[k], sub:"PEOPLE · "+r.n+" cells",
    cell:A.cellAt(r.x/r.n,r.y/r.n), zoom:1.2}));
  D.biomes.forEach((b,ix)=>{
    if(b.name==="Marine") return;
    let cell=-1;
    for(let i=0;i<A.count;i++) if(C.b[i]===ix){ cell=i; break; }
    if(cell>=0) out.push({name:b.name, sub:"BIOME · habitability "+b.hab,
      cell:cell, zoom:2.2});
  });
  return out;
}
let INDEX=null;
const idx=()=>INDEX||(INDEX=index());

function search(term,limit){
  const t=term.trim().toLowerCase();
  if(!t) return [];
  const hits=idx().filter(r=>r.name.toLowerCase().includes(t));
  hits.sort((a,b)=>{
    const ai=a.name.toLowerCase().startsWith(t), bi=b.name.toLowerCase().startsWith(t);
    if(ai!==bi) return ai?-1:1;
    return a.name.length-b.name.length;
  });
  return hits.slice(0,limit||12);
}
function fillResults(box,term,onPick){
  const hits=search(term);
  box.innerHTML="";
  if(!hits.length){ box.classList.remove("on"); return; }
  hits.forEach(r=>{
    const b=document.createElement("button");
    b.innerHTML="";
    b.appendChild(document.createTextNode(r.name));
    const s=document.createElement("span"); s.className="sub"; s.textContent=r.sub;
    b.appendChild(s);
    b.onclick=()=>onPick(r);
    box.appendChild(b);
  });
  box.classList.add("on");
}

function plan(){
  const out=q("wOut");
  if(ends.from==null||ends.to==null){
    out.innerHTML='<div class="rterr">Set both ends first.</div>'; return;
  }
  const t0=performance.now();
  const r=A.route.find(ends.from,ends.to);
  const ms=Math.round(performance.now()-t0);
  if(!r.ok){
    map.clearRoute();
    out.innerHTML='<div class="rterr">'+r.why+'</div>'+seaNote(ends.from,ends.to);
    return;
  }
  map.drawRoute(r.cells);
  const straight=A.route.miles(ends.from,ends.to);
  const fords=r.legs.reduce((n,l)=>n+l.fords,0);
  const climb=r.legs.reduce((n,l)=>n+l.climb,0);
  let html='<div class="rtcard on"><div class="rth"><i style="background:#7A3E8F"></i>'+
    '<b>LEAST COST</b><span>'+miles(r.cost)+'</span></div>'+
    '<div class="rtm">'+daysText(r.cost)+' of supply · '+r.cells.length+
    ' cells · '+fords+' ford'+(fords===1?"":"s")+' · '+climb+' of climb</div>'+
    '<div class="rtm">'+miles(straight)+' as the raven flies, so '+
    (r.cost/straight).toFixed(2)+'× the straight line</div></div>';
  html+='<ul class="rtlegs">';
  r.legs.forEach(l=>{
    html+='<li><b>'+esc(l.biome)+'</b><span>'+
      (l.state==="Neutrals"?"UNCLAIMED":esc(l.state.toUpperCase()))+' · '+
      miles(l.cost)+' effective, '+miles(l.miles)+' on the ground</span>'+
      (l.fords?'<em>'+l.fords+' river crossing'+(l.fords===1?"":"s")+
        ' at '+M.riverCrossMi+' mi each</em>':'')+'</li>';
  });
  html+='</ul>';
  html+='<p class="rtfoot">Priced by the same model that laid the trade network: '+
    'biome cost against grassland, climb over a divisor of '+M.slopeDivisor+
    ', and '+M.riverCrossMi+' effective miles for an unbridged crossing. '+
    'Solved in '+ms+' ms.</p>';
  out.innerHTML=html;
}
function seaNote(a,b){
  const pa=nearestPort(a), pb=nearestPort(b);
  if(!pa||!pb) return "";
  return '<p class="rtfoot">The nearest harbours are '+esc(pa.name)+' and '+
    esc(pb.name)+'. '+D.report.harbor_capable_burgs+
    ' burgs on the sheet can take shipping; none is flagged as a working port in the '+
    'source file, so no sea leg is drawn.</p>';
}
function nearestPort(cell){
  let best=null,bd=Infinity;
  A.burgs.forEach(b=>{
    if(!A.portOf(b.cell)) return;
    const d=Math.hypot(C.x[b.cell]-C.x[cell],C.y[b.cell]-C.y[cell]);
    if(d<bd){bd=d;best=b;}
  });
  return best;
}

/* ---- a reach: how far a place can supply ------------------------------------------ */
/* Days, not miles, and sized to this world: half the land sits more than forty days
   from its own market, so a reach worth drawing has to run to hundreds. */
const BANDS=[25,50,100,200,400];
function runReach(cell){
  if(!A.isLand(cell)){ toast("A reach can only be cast from land"); return; }
  const {dist}=A.route.from(cell);
  map.drawReach(dist,BANDS);
  reachOn=true;
  q("reachBtn").setAttribute("aria-pressed","true");

  const cells=BANDS.map(()=>0), pop=BANDS.map(()=>0), burgs=BANDS.map(()=>0);
  let unreached=0;
  for(let i=0;i<A.count;i++){
    if(!A.isLand(i)) continue;
    const d=isFinite(dist[i])?A.daysOf(dist[i]):Infinity;
    let placed=false;
    for(let b=0;b<BANDS.length;b++)
      if(d<=BANDS[b]){ cells[b]++; pop[b]+=C.pop[i]; if(A.burgOf(i)) burgs[b]++;
        placed=true; break; }
    if(!placed) unreached++;
  }
  openWay();
  let html='<div class="rtcard on"><div class="rth">'+
    '<i style="background:#7A3E8F"></i><b>REACH FROM</b><span>'+esc(nameOf(cell))+
    '</span></div><div class="rtm">'+
    cells.reduce((a,b)=>a+b,0).toLocaleString()+' cells, '+
    pop.reduce((a,b)=>a+b,0).toLocaleString()+' people and '+
    burgs.reduce((a,b)=>a+b,0)+' burgs lie within '+BANDS[BANDS.length-1]+
    ' days</div></div><ul class="rtlegs">';
  let run=0, runPop=0, runBurg=0;
  BANDS.forEach((d,b)=>{
    run+=cells[b]; runPop+=pop[b]; runBurg+=burgs[b];
    html+='<li><b>within '+d+' days</b><span>'+run.toLocaleString()+' cells · '+
      runPop.toLocaleString()+' people · '+runBurg+' burg'+(runBurg===1?"":"s")+
      '</span></li>';
  });
  html+='</ul>';
  html+='<p class="rtfoot">'+unreached.toLocaleString()+
    ' land cells lie further off or on another landmass entirely. Bands are days at '+
    M.supplyDivisor+' effective miles each — the figure the generator used to turn '+
    'cost into supply. Press RCH again to clear it.</p>';
  q("wOut").innerHTML=html;
  toast("Reach cast from "+nameOf(cell));
}
function clearReach(){
  reachOn=false; map.clearReach(); q("reachBtn").setAttribute("aria-pressed","false");
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fillDrawer(){
  const body=q("drawerBody"); body.innerHTML="";
  if(tab==="marks"){
    const all=store.all();
    q("drawerFoot").style.display="";
    if(!all.length){
      body.innerHTML='<p class="empty">No marks yet. Press <b>PIN</b> and tap the plate '+
        'to drop one, or use MARK HERE on any place you have opened. Marks are kept in '+
        'this browser and nowhere else.</p>';
      return;
    }
    all.forEach(p=>{
      const b=document.createElement("button"); b.className="row";
      b.innerHTML='<b>'+esc(p.name)+'</b><span>'+esc(describe(A.cellAt(p.x,p.y)))+'</span>'+
        (p.note?'<i>'+esc(p.note)+'</i>':'');
      b.onclick=()=>{ closeDrawer(); map.flyTo(p.x,p.y,Math.max(map.scale,4)); showPin(p); };
      body.appendChild(b);
    });
    return;
  }
  q("drawerFoot").style.display="none";
  if(tab==="account"){ fillAccount(body); return; }

  /* the index: realms, and what stands in them */
  const byState=new Map();
  A.burgs.forEach(b=>{ const k=b.state; (byState.get(k)||byState.set(k,[]).get(k)).push(b); });
  const order=[...byState.keys()].sort((a,b)=>
    (D.states[a]||"").localeCompare(D.states[b]||""));
  order.forEach(st=>{
    const h=document.createElement("p"); h.className="grp";
    h.textContent=(D.states[st]||"Unclaimed").toUpperCase();
    body.appendChild(h);
    byState.get(st).sort((a,b)=>b.pop-a.pop).forEach(b=>{
      const mkt=A.marketOf(b.cell), port=A.portOf(b.cell);
      const btnEl=document.createElement("button"); btnEl.className="row";
      btnEl.innerHTML='<b>'+esc(b.name)+(mkt?' ◎':'')+'</b><span>'+
        b.pop.toLocaleString()+(port?' · HARBOUR '+port.quality:'')+' · '+
        esc(A.biomeOf(b.cell).name)+'</span>';
      btnEl.onclick=()=>{ closeDrawer(); map.flyTo(C.x[b.cell],C.y[b.cell],5);
        showCell(b.cell); };
      body.appendChild(btnEl);
    });
  });
}

const MODE_ORDER=["biome","relief","realm","culture","catchment","supply","density",
  "habitability"];
function swatch(c){ return '<i style="background:'+c+'"></i>'; }
function fillKey(){
  const mode=map.mode;
  let h='<b>GROUND — '+A.map.MODES[mode].label+'</b>';
  if(mode==="biome"){
    Object.keys(PAL.BIOME).filter(n=>n!=="Marine").sort().forEach(n=>
      h+=swatch(PAL.BIOME[n])+n.toUpperCase()+"<br>");
  } else if(mode==="realm"){
    D.states.forEach(n=>{ if(n) h+=swatch(PAL.realm(n))+
      (n==="Neutrals"?"UNCLAIMED":n.toUpperCase())+"<br>"; });
  } else if(mode==="culture"){
    D.cultures.forEach((n,i)=>{ if(i&&D.cultures.indexOf(n)!==i) return;
      if(n) h+=swatch(PAL.culture(n))+n.toUpperCase()+"<br>"; });
  } else if(mode==="catchment"){
    D.markets.forEach((m,i)=>h+=swatch(PAL.catchment(i))+m.name.toUpperCase()+"<br>");
    h+=swatch("#E6E2D2")+"BEYOND EVERY MARKET<br>";
  } else if(mode==="supply"){
    h+=ramp(PAL.SUPPLY,"AT THE MARKET","FARTHEST")+swatch("#E6E2D2")+"BEYOND REACH<br>";
  } else if(mode==="relief"){
    h+=ramp(PAL.RELIEF,"SHORE","SUMMIT");
  } else if(mode==="density"){
    h+=ramp(PAL.DENSITY,"EMPTY","THICKEST");
  } else if(mode==="habitability"){
    h+=ramp(PAL.HAB,"BARREN","KINDEST");
  }
  h+='<b>ON THE PLATE</b>'+
    '<span style="display:inline-block;width:11px;text-align:center;margin-right:6px">◎</span>'+
    'RINGED · MARKET CENTRE<br>'+
    '<span style="display:inline-block;width:11px;text-align:center;margin-right:6px">—</span>'+
    'BARRED · HARBOUR<br>'+
    swatch(PAL.road.trunk)+'TRUNK &nbsp;'+swatch(PAL.road.road)+'ROAD &nbsp;'+
    swatch(PAL.road.trail)+'TRAIL<br>'+
    swatch(PAL.river)+'RIVER, THICKENED BY FLUX<br>'+
    swatch("#7A3E8F")+'YOUR MARKS AND ANY WAY FOUND'+
    '<b>KEYS</b>/ SEARCH &nbsp; G GROUND &nbsp; K KEY<br>'+
    'W WAY &nbsp; P PIN &nbsp; B INDEX &nbsp; R ROADS<br>ESC OUT';
  q("key").innerHTML=h;
}
function ramp(list,lo,hi){
  let h='<span style="display:inline-block;vertical-align:-2px;margin-right:6px">';
  list.forEach(c=>h+='<i style="background:'+c+';width:9px;margin:0;border-radius:0"></i>');
  return h+'</span>'+lo+' → '+hi+'<br>';
}

function boot(){
  const t0=performance.now();
  map=A.map.init({
    svg:q("map"), stage:q("stage"),
    onGround(cell,x,y){
      if(pinMode){ dropMark(x,y); setPin(false); return; }
      if(pickFor){ if(!A.isLand(cell)){ toast("That end is in the water"); return; }
        setEnd(pickFor,cell); setPick(null); return; }
      if(cell>=0) showCell(cell);
    },
    onBurg(b){ showCell(b.cell); },
    onPin(p){ showPin(p); }
  });
  refreshPins();
  fillKey();
  const ms=Math.round(performance.now()-t0);
  q("hdrSub").textContent=
    M.cells.toLocaleString()+" CELLS · "+D.report.land_cells.toLocaleString()+" LAND · "+
    D.markets.length+" MARKETS · "+A.burgs.length+" BURGS · "+
    D.report.harbor_capable_burgs+" HARBOURS · PLATE CUT IN "+ms+" MS";

  /* ---- header search ---- */
  const si=q("search"), sr=q("results"), sw=q("srch");
  si.addEventListener("input",()=>{
    sw.classList.toggle("has",!!si.value);
    fillResults(sr,si.value,r=>{
      sr.classList.remove("on"); si.blur();
      map.flyTo(C.x[r.cell],C.y[r.cell],r.zoom||4);
      showCell(r.cell);
    });
  });
  q("searchClear").onclick=()=>{ si.value=""; sw.classList.remove("has");
    sr.classList.remove("on"); si.focus(); };
  document.addEventListener("click",e=>{ if(!sw.contains(e.target)) sr.classList.remove("on"); });

  /* ---- the rail ---- */
  let modeIx=0;
  q("grndBtn").onclick=()=>{
    modeIx=(modeIx+1)%MODE_ORDER.length;
    map.setMode(MODE_ORDER[modeIx]);
    q("grndBtn").textContent=A.map.MODES[map.mode].label.slice(0,4);
    fillKey();
    toast("Ground — "+A.map.MODES[map.mode].label.toLowerCase());
  };
  const toggles=[["rdBtn","road",true],["rivBtn","river",true],["brdBtn","march",true],
    ["grtBtn","grat",false]];
  toggles.forEach(([id,layer,on])=>{
    const b=q(id); let state=on;
    b.setAttribute("aria-pressed",String(state));
    map.setLayer(layer,state);
    b.onclick=()=>{ state=!state; b.setAttribute("aria-pressed",String(state));
      map.setLayer(layer,state); };
  });
  q("keyBtn").onclick=()=>{
    const on=q("key").classList.toggle("on");
    q("keyBtn").setAttribute("aria-pressed",String(on));
  };
  function setPin(on){
    pinMode=on;
    q("pinBtn").setAttribute("aria-pressed",String(on));
    q("stage").classList.toggle("pinning",on);
    if(on){ setPick(null); toast("Tap the plate to drop a mark"); }
  }
  q("pinBtn").onclick=()=>setPin(!pinMode);
  q("listBtn").onclick=()=>q("drawer").classList.contains("on")?closeDrawer():openDrawer();
  q("drawerClose").onclick=closeDrawer;
  q("tabIndex").onclick=()=>openDrawer("index");
  q("tabMarks").onclick=()=>openDrawer("marks");
  q("tabAccount").onclick=()=>openDrawer("account");
  q("wayBtn").onclick=()=>q("wayPanel").classList.contains("on")?closeWay():openWay();
  q("wayClose").onclick=closeWay;
  q("reachBtn").onclick=()=>{
    if(reachOn){ clearReach(); return; }
    const at=sel!=null?sel:ends.from;
    if(at==null){ toast("Open a place first, then cast a reach from it"); return; }
    runReach(at);
  };
  q("zin").onclick=()=>map.zoomAt(1.35,innerWidth/2,innerHeight/2);
  q("zout").onclick=()=>map.zoomAt(1/1.35,innerWidth/2,innerHeight/2);
  q("rst").onclick=()=>{ map.fit(); closeSheet(); };

  /* ---- the way console ---- */
  [["from","wFrom","wFromRes","wFromPick"],["to","wTo","wToRes","wToPick"]]
  .forEach(([which,inp,res,pick])=>{
    q(inp).addEventListener("input",()=>{
      ends[which]=null;
      fillResults(q(res),q(inp).value,r=>{
        q(res).classList.remove("on");
        setEnd(which,r.cell);
      });
    });
    q(pick).onclick=()=>setPick(pickFor===which?null:which);
  });
  q("wSwap").onclick=()=>{
    const a=ends.from, b=ends.to;
    ends.from=b; ends.to=a;
    q("wFrom").value=b==null?"":nameOf(b);
    q("wTo").value=a==null?"":nameOf(a);
    if(ends.from!=null&&ends.to!=null) plan();
  };
  q("wPlan").onclick=plan;
  q("wClear").onclick=()=>{
    ends={from:null,to:null}; q("wFrom").value=""; q("wTo").value="";
    q("wOut").innerHTML=""; map.clearRoute(); clearReach(); setPick(null);
  };

  /* ---- the editor ---- */
  q("edSave").onclick=()=>closeEditor(true);
  q("edCancel").onclick=()=>closeEditor(false);
  q("edDel").onclick=()=>{ if(editing){ store.remove(editing.id); editing=null;
    closeEditor(false); closeSheet(); toast("Mark removed"); } };
  q("scrim").onclick=()=>closeEditor(false);
  q("closeSheet").onclick=closeSheet;

  /* ---- marks in and out ---- */
  q("mkCopy").onclick=()=>{
    const txt=JSON.stringify(store.all(),null,1);
    navigator.clipboard?navigator.clipboard.writeText(txt).then(
      ()=>toast("Marks copied"),()=>toast("Could not copy")):toast("Could not copy");
  };
  q("mkPaste").onclick=()=>{
    const txt=prompt("Paste marks as JSON:");
    if(!txt) return;
    try{
      const rows=JSON.parse(txt);
      if(!Array.isArray(rows)) throw 0;
      const have=store.all();
      rows.forEach(r=>{ if(typeof r.x==="number"&&typeof r.y==="number")
        have.push({id:"m"+Math.random().toString(36).slice(2,9),x:r.x,y:r.y,
          name:String(r.name||"Imported mark"),note:String(r.note||"")}); });
      store.save(have); refreshPins(); toast("Imported "+rows.length+" marks");
    }catch(e){ toast("That was not a list of marks"); }
  };
  q("mkClear").onclick=()=>{
    if(!store.all().length) return;
    if(confirm("Remove every mark on this plate?")){ store.save([]); refreshPins();
      closeSheet(); toast("Marks cleared"); }
  };

  /* ---- keys ---- */
  addEventListener("keydown",e=>{
    if(e.target.matches("input,textarea")){
      if(e.key==="Escape") e.target.blur();
      if(e.key==="Enter"&&e.target.id==="wFrom") q("wTo").focus();
      if(e.key==="Enter"&&e.target.id==="wTo") plan();
      return;
    }
    const k=e.key.toLowerCase();
    if(k==="/"){ e.preventDefault(); si.focus(); si.select(); }
    else if(k==="g") q("grndBtn").click();
    else if(k==="k") q("keyBtn").click();
    else if(k==="w") q("wayBtn").click();
    else if(k==="p") q("pinBtn").click();
    else if(k==="b") q("listBtn").click();
    else if(k==="r") q("rdBtn").click();
    else if(e.key==="Escape"){
      closeSheet(); closeDrawer(); closeWay(); setPin(false); setPick(null);
      q("key").classList.remove("on"); q("keyBtn").setAttribute("aria-pressed","false");
    }
  });

  q("grndBtn").textContent=A.map.MODES[map.mode].label.slice(0,4);
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
})();
</script>
<script>
/* ===================================================================================
   A guided read of the sheet. Both sheets carry a great deal and almost none of it
   announces itself, so this walks a reader round the controls and works them as it
   goes: the step that explains the fabric turns the fabric on, the step that explains
   the way-finder opens it. Nothing is described that is not also shown.

   It runs itself once, the first time a sheet is opened in a browser, and afterwards
   lives behind the ? on the rail.
   =================================================================================== */
(function(){
"use strict";
const q=id=>document.getElementById(id);
const has=id=>!!q(id);

/* ---- small helpers for driving the app's own controls ----------------------------- */
const pressed=el=>el&&el.getAttribute("aria-pressed")==="true";
function toggle(id,on){                       /* a rail button with aria-pressed */
  const b=q(id); if(!b) return;
  if(pressed(b)!==!!on) b.click();
}
function panel(btnId,panelId,on){             /* a button that opens a panel */
  const p=q(panelId); if(!p) return;
  if(p.classList.contains("on")!==!!on&&q(btnId)) q(btnId).click();
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* =================================================================================== */
/*  the engine                                                                         */
/* =================================================================================== */
let steps=null, ix=0, live=false, onEnd=null;
let dim,hole,card,ttl,body,count,prev,next,skip;

function build(){
  if(dim) return;
  dim=document.createElement("div"); dim.className="tourdim";
  hole=document.createElement("div"); hole.className="tourhole";
  dim.appendChild(hole);
  card=document.createElement("div"); card.className="tourcard";
  card.innerHTML=
    '<p class="tt"></p><div class="tb"></div>'+
    '<div class="tf"><span class="tc"></span>'+
    '<button class="tskip">SKIP</button>'+
    '<button class="tprev">BACK</button>'+
    '<button class="tnext">NEXT</button></div>';
  document.body.appendChild(dim);
  document.body.appendChild(card);
  ttl=card.querySelector(".tt"); body=card.querySelector(".tb");
  count=card.querySelector(".tc");
  prev=card.querySelector(".tprev"); next=card.querySelector(".tnext");
  skip=card.querySelector(".tskip");
  prev.onclick=()=>go(ix-1);
  next.onclick=()=>go(ix+1);
  skip.onclick=()=>stop();
  dim.onclick=e=>{ if(e.target===dim) go(ix+1); };
  addEventListener("keydown",key,true);
  addEventListener("resize",()=>{ if(live) place(); });
}

function key(e){
  if(!live) return;
  e.stopPropagation();
  if(e.key==="Escape"){ e.preventDefault(); stop(); }
  else if(e.key==="ArrowRight"||e.key==="Enter"){ e.preventDefault(); go(ix+1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); go(ix-1); }
}

/* The union of several elements' rectangles, skipping any that are not on screen —
   used where the thing being explained is a control and the panel it just opened. */
function union(){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  [].slice.call(arguments).forEach(sel=>{
    const n=typeof sel==="string"?document.querySelector(sel):sel;
    if(!n) return;
    const r=n.getBoundingClientRect();
    if(!r.width||!r.height) return;
    x0=Math.min(x0,r.left); y0=Math.min(y0,r.top);
    x1=Math.max(x1,r.right); y1=Math.max(y1,r.bottom);
  });
  if(x0===Infinity) return null;
  return {x:x0-8,y:y0-8,w:x1-x0+16,h:y1-y0+16};
}

/* where the hole is: a named element, a custom rectangle, or nothing at all */
function targetRect(s){
  if(s.spot) return s.spot();
  if(!s.el) return null;
  const n=typeof s.el==="string"?document.querySelector(s.el):s.el;
  if(!n) return null;
  const r=n.getBoundingClientRect();
  if(!r.width||!r.height) return null;
  const pad=s.pad==null?8:s.pad;
  return {x:r.left-pad, y:r.top-pad, w:r.width+pad*2, h:r.height+pad*2};
}

function place(){
  const s=steps[ix], r=targetRect(s);
  if(!r){
    /* nothing to point at, so the dimmer paints its own ground instead of relying on
       the hole's shadow to do it */
    dim.classList.add("solid");
    hole.style.display="none";
    card.style.left="50%"; card.style.top="50%";
    card.style.transform="translate(-50%,-50%)";
    return;
  }
  dim.classList.remove("solid");
  hole.style.display="";
  hole.style.left=r.x+"px"; hole.style.top=r.y+"px";
  hole.style.width=r.w+"px"; hole.style.height=r.h+"px";
  hole.style.borderRadius=(s.round==null?12:s.round)+"px";

  card.style.transform="none";
  const cw=card.offsetWidth, ch=card.offsetHeight, gap=14;
  let x,y;
  if(r.x-gap-cw>8) x=r.x-gap-cw;                     /* left of the target */
  else if(r.x+r.w+gap+cw<innerWidth-8) x=r.x+r.w+gap; /* right of it */
  else x=Math.min(Math.max(8,r.x+r.w/2-cw/2),innerWidth-cw-8);
  if(x===r.x-gap-cw||x===r.x+r.w+gap) y=r.y+r.h/2-ch/2;
  else if(r.y+r.h+gap+ch<innerHeight-8) y=r.y+r.h+gap;
  else y=r.y-gap-ch;
  card.style.left=Math.round(Math.min(Math.max(8,x),innerWidth-cw-8))+"px";
  card.style.top=Math.round(Math.min(Math.max(8,y),innerHeight-ch-8))+"px";
}

async function go(n){
  if(!live) return;
  if(n<0) return;
  if(n>=steps.length) return stop(true);
  const from=steps[ix];
  if(from&&from.after&&n!==ix) try{ from.after(); }catch(e){}
  ix=n;
  const s=steps[ix];
  /* Let the click that got us here finish bubbling first. The sheets close their own
     search results on any click landing outside the box, so a step that types into it
     during that same click has its results shut again a moment later. */
  await sleep(0);
  if(!live) return;
  if(s.before) try{ s.before(); }catch(e){}
  if(s.wait) await sleep(s.wait);
  if(!live) return;
  ttl.textContent=s.title;
  body.innerHTML=s.body;
  count.textContent=(ix+1)+" / "+steps.length;
  prev.style.visibility=ix?"":"hidden";
  next.textContent=ix===steps.length-1?"DONE":"NEXT";
  card.classList.remove("on");
  place();
  requestAnimationFrame(()=>card.classList.add("on"));
}

function start(list,opts){
  build();
  steps=list; ix=-1; live=true;
  onEnd=(opts||{}).onEnd||null;
  dim.classList.add("on");
  go(0);
}
function stop(finished){
  if(!live) return;
  const s=steps&&steps[ix];
  if(s&&s.after) try{ s.after(); }catch(e){}
  live=false;
  dim.classList.remove("on"); card.classList.remove("on");
  if(onEnd) try{ onEnd(!!finished); }catch(e){}
}

  "the <b>port</b> plan: a staple where the land road meets the quay, radials to each "+
  "gate, rings thrown across them.<br><br>A burg with two trunk roads leaving on "+
  "nearly opposite bearings is not a town with roads but a road with a town on it, and "+
  "gets the <b>crossing</b> plan instead. Exactly one market in Adrinem answers to "+
  "that.<br><br><b>Esc</b> or the <b>×</b> returns you to the world sheet."}
];

/* =================================================================================== */
/*  wiring                                                                             */
/* =================================================================================== */
const SHEET=has("simBtn")?"nyc":has("grndBtn")?"adrinem":null;
const KEY="tour.seen."+SHEET+".v1", PKEY="tour.seen.plate.v1";
const seen=k=>{ try{ return !!localStorage.getItem(k); }catch(e){ return true; } };
const mark=k=>{ try{ localStorage.setItem(k,"1"); }catch(e){} };

function startSheet(){
  if(!SHEET) return;
  start(SHEET==="nyc"?NYC_STEPS:ADRINEM_STEPS,{onEnd(){ mark(KEY); }});
}
function startPlate(){ start(PLATE_STEPS,{onEnd(){ mark(PKEY); }}); }

function addButton(rail,id,label,fn){
  if(!rail||q(id)) return;
  const b=document.createElement("button");
  b.id=id; b.className="sm"; b.textContent="?";
  b.setAttribute("aria-label",label);
  b.style.fontSize="15px";
  b.onclick=fn;
  rail.appendChild(b);
}
function addButtons(){
  addButton(document.querySelector(".ctl"),"tourBtn","How this sheet works",startSheet);
  addButton(document.querySelector(".cpctl"),"cpTourBtn","How this plate works",
    startPlate);
}

function boot(){
  if(!SHEET) return;
  addButtons();
  if(!seen(KEY)) setTimeout(startSheet,900);
}

window.TOUR={
  start:startSheet, startPlate:startPlate, stop:stop,
  /* the plate walk runs itself the first time a plate is opened, and not again */
  maybePlate(){ if(!seen(PKEY)&&!live) setTimeout(startPlate,700); },
  reset(){ try{ localStorage.removeItem(KEY); localStorage.removeItem(PKEY); }catch(e){} }
};
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
})();
</script>
</body>
</html>
