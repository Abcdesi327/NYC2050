<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Adrinem — an infrastructure plate of a high fantasy world: its realms, its peoples, its trade network and how far supply actually reaches.">
<title>Adrinem — Infrastructure Plate</title>
<style>
/* ===================================================================================
   NYC 2050 — survey sheet styling. Paper, ink, and as little chrome as possible.
   =================================================================================== */
:root{
  --paper:#FAF9F5; --ink:#2C2C2A; --muted:#6B6A64; --rule:#D3D1C7;
  --water:#61757F; --land:#B4B2A9; --far:#C6C4BA; --park:#4E6B3A;
  --z1:#8F2222; --z2:#C4472A; --z3:#E08A24; --z4:#F2C572; --z5:#E8E3C8;
  --mark:#7A3E8F;
  --cond:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,"Courier New",monospace;
  --panel:rgba(250,249,245,.96);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);
  font-family:var(--cond);color:var(--ink)}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab;background:var(--water)}
#stage.drag{cursor:grabbing}
#stage.pinning{cursor:crosshair}
#stage.pinning::after{content:"";position:fixed;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 3px var(--mark);opacity:.55}
svg{display:block;width:100%;height:100%}
text{-webkit-user-select:none;user-select:none;pointer-events:none}
button{font-family:var(--cond);color:var(--ink)}

/* ---------- header ---------------------------------------------------------------- */
.hdr{position:fixed;top:0;left:0;right:0;padding:9px 12px 8px;
  background:rgba(250,249,245,.94);border-bottom:1px solid var(--rule);
  backdrop-filter:blur(8px);z-index:30;display:flex;align-items:center;gap:10px}
.hdr .ttl{flex:1;min-width:0}
.hdr h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr p{margin:2px 0 0;font-size:10.5px;color:var(--muted);font-family:var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch{position:relative;flex:0 1 300px}
.srch input{width:100%;height:32px;padding:0 28px 0 10px;border:1px solid var(--rule);
  border-radius:8px;background:#fff;font-family:var(--mono);font-size:11px;color:var(--ink)}
.srch input:focus{outline:2px solid var(--z2);outline-offset:-1px}
.srch .sx{position:absolute;right:6px;top:6px;width:20px;height:20px;border:0;
  background:transparent;color:var(--muted);font-size:13px;cursor:pointer;display:none}
.srch.has .sx{display:block}
.res{position:absolute;top:36px;left:0;right:0;max-height:min(52vh,340px);overflow:auto;
  background:var(--panel);border:1px solid var(--rule);border-radius:10px;
  box-shadow:0 8px 24px rgba(44,44,42,.16);display:none;z-index:31}
.res.on{display:block}
.res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #EAE8DF;
  background:transparent;padding:7px 10px;cursor:pointer;font-size:13px}
.res button:last-child{border-bottom:0}
.res button:hover,.res button.sel{background:#EFEDE4}
.res .sub{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);
  letter-spacing:.04em;margin-top:1px}

/* ---------- control rail ---------------------------------------------------------- */
.ctl{position:fixed;right:12px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:25}
.ctl button{width:44px;height:40px;border:1px solid var(--rule);border-radius:10px;
  background:var(--panel);font-size:17px;font-weight:600;cursor:pointer;
  backdrop-filter:blur(8px);line-height:1;position:relative}
.ctl button:active{background:#EFEDE5}
.ctl button:focus-visible{outline:2px solid var(--z2);outline-offset:2px}
.ctl button.sm{font-size:9.5px;letter-spacing:.04em;font-family:var(--mono)}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ctl button#pinBtn[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#fff}
.ctl .badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--mark);color:#fff;font-family:var(--mono);font-size:9px;
  line-height:16px;text-align:center;display:none}
.ctl .badge.on{display:block}

/* ---------- legend ---------------------------------------------------------------- */
.key{position:fixed;left:12px;top:56px;background:var(--panel);
  border:1px solid var(--rule);border-radius:10px;padding:9px 11px;z-index:24;
  font-family:var(--mono);font-size:10px;line-height:1.75;color:#44443F;
  backdrop-filter:blur(8px);display:none;max-height:calc(100vh - 150px);overflow:auto}
.key.on{display:block}
.key b{display:block;font-family:var(--cond);font-size:11px;letter-spacing:.05em;
  margin-bottom:4px;color:var(--ink)}
.key b+b,.key .gap{margin-top:7px}
.key i{display:inline-block;width:11px;height:11px;border-radius:2px;
  vertical-align:-1px;margin-right:6px}

/* ---------- info sheet ------------------------------------------------------------ */
.sheet{position:fixed;left:12px;bottom:14px;width:min(340px,calc(100vw - 80px));
  background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  padding:12px 14px;z-index:26;backdrop-filter:blur(8px);display:none;
  box-shadow:0 6px 20px rgba(44,44,42,.12)}
.sheet.on{display:block}
.sheet .nm{font-size:15px;font-weight:600;margin:0 0 3px;padding-right:22px}
.sheet .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);
  letter-spacing:.03em;margin:0 0 7px}
.sheet .code{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.06em;padding:2px 6px;border-radius:4px;color:var(--paper);margin-bottom:7px}
.sheet .note{font-size:12.5px;line-height:1.45;margin:0;color:#44443F}
.sheet .x{position:absolute;top:8px;right:9px;width:22px;height:22px;border:0;
  background:transparent;color:var(--muted);font-size:16px;cursor:pointer;line-height:1}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts button{flex:1 1 auto;min-height:30px;padding:0 10px;border:1px solid var(--rule);
  border-radius:8px;background:#fff;font-family:var(--mono);font-size:10px;
  letter-spacing:.05em;cursor:pointer;white-space:nowrap}
.acts button:hover{background:#F2F0E7}
.acts button.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.acts button.pri:hover{background:#3E3E3A}
.acts button.on{background:var(--mark);color:#fff;border-color:var(--mark)}

/* ---------- drawer (index + bookmarks) -------------------------------------------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(340px,86vw);z-index:35;
  background:var(--panel);border-left:1px solid var(--rule);backdrop-filter:blur(10px);
  transform:translateX(101%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{padding:12px 14px 10px;border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:8px}
.drawer header h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.03em;flex:1}
.drawer header button{border:0;background:transparent;font-size:17px;color:var(--muted);
  cursor:pointer;line-height:1;padding:2px 4px}
.drawer .body{flex:1;overflow:auto;padding:10px 12px 20px}
.drawer .empty{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.7;
  padding:14px 4px}
.row{border:1px solid var(--rule);border-radius:10px;background:#fff;padding:9px 10px;
  margin-bottom:7px;cursor:pointer;position:relative}
.row:hover{background:#F7F5EC}
.row .rn{font-size:13.5px;font-weight:600;padding-right:52px}
.row .rm{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.04em;
  margin-top:2px}
.row .rnote{font-size:11.5px;color:#55554F;margin-top:5px;line-height:1.4}
.row .rx{position:absolute;top:6px;right:6px;border:0;background:transparent;
  color:var(--muted);font-size:14px;cursor:pointer;padding:2px 5px;border-radius:5px}
.row .rx:hover{background:#EFEDE4;color:var(--z1)}
.row .rv{position:absolute;top:6px;right:28px;border:0;background:transparent;
  color:var(--muted);font-size:12px;cursor:pointer;padding:2px 5px;border-radius:5px}
.row .rv:hover{background:#EFEDE4;color:var(--ink)}
.row .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;
  vertical-align:1px}
.drawer .foot{border-top:1px solid var(--rule);padding:9px 12px;display:flex;gap:6px}
.drawer .foot button{flex:1;height:30px;border:1px solid var(--rule);border-radius:8px;
  background:#fff;font-family:var(--mono);font-size:10px;letter-spacing:.05em;cursor:pointer}
.drawer .foot button:hover{background:#F2F0E7}
.tabs{display:flex;gap:4px;padding:8px 12px 0}
.tabs button{flex:1;height:28px;border:1px solid var(--rule);border-radius:8px;background:#fff;
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- pin editor ------------------------------------------------------------ */
.editor{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;
  width:min(360px,92vw);background:var(--paper);border:1px solid var(--rule);
  border-radius:14px;padding:16px;box-shadow:0 18px 50px rgba(44,44,42,.28);display:none}
.editor.on{display:block}
.editor h3{margin:0 0 2px;font-size:15px;font-weight:600}
.editor .loc{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em;
  margin-bottom:12px}
.editor label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  color:var(--muted);margin:0 0 4px}
.editor input,.editor textarea{width:100%;border:1px solid var(--rule);border-radius:8px;
  padding:8px 9px;font-family:var(--cond);font-size:13.5px;background:#fff;color:var(--ink);
  margin-bottom:10px;resize:vertical}
.editor textarea{min-height:64px;font-size:12.5px;line-height:1.45}
.editor input:focus,.editor textarea:focus{outline:2px solid var(--mark);outline-offset:-1px}
.editor .btns{display:flex;gap:7px}
.editor .btns button{flex:1;height:34px;border:1px solid var(--rule);border-radius:8px;
  background:#fff;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;cursor:pointer}
.editor .btns button.pri{background:var(--mark);color:#fff;border-color:var(--mark)}
.editor .btns button.del{color:var(--z1)}
.scrim{position:fixed;inset:0;background:rgba(44,44,42,.28);z-index:34;display:none}
.scrim.on{display:block}

/* ---------- street view ----------------------------------------------------------- */
.sv{position:fixed;inset:0;z-index:50;background:#0F1113;display:none;
  flex-direction:column;overscroll-behavior:contain}
.sv.on{display:flex}
.sv .frame{flex:1;position:relative;overflow:hidden;background:#0F1113}
.sv svg{position:absolute;inset:0;width:100%;height:100%}
.sv .bar{position:absolute;left:0;right:0;top:0;padding:11px 14px;z-index:3;
  background:linear-gradient(rgba(12,14,16,.82),rgba(12,14,16,0));
  display:flex;align-items:flex-start;gap:10px;pointer-events:none}
.sv .bar .t{flex:1;min-width:0;pointer-events:none}
.sv .bar h2{margin:0;font-size:16px;font-weight:600;color:#F2EFE6;letter-spacing:.02em}
.sv .bar p{margin:2px 0 0;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  color:#A9A79E}
.sv .bar button{pointer-events:auto}
.sv .close{width:34px;height:34px;border-radius:9px;border:1px solid rgba(242,239,230,.28);
  background:rgba(20,22,24,.6);color:#F2EFE6;font-size:17px;cursor:pointer;line-height:1;
  flex:0 0 auto}
.sv .cap{position:absolute;left:14px;right:14px;bottom:70px;z-index:3;max-width:560px;
  font-size:13px;line-height:1.5;color:#E6E3D9;text-shadow:0 1px 6px rgba(0,0,0,.85);
  pointer-events:none}
.sv .cap .disp{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;
  letter-spacing:.08em;padding:2px 6px;border-radius:4px;color:#fff;margin-bottom:6px}
.sv .nav{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:10px 12px 14px;
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(rgba(12,14,16,0),rgba(12,14,16,.88))}
.sv .nav button{height:36px;padding:0 12px;border-radius:9px;
  border:1px solid rgba(242,239,230,.26);background:rgba(20,22,24,.62);color:#F2EFE6;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;cursor:pointer;
  backdrop-filter:blur(6px);white-space:nowrap}
.sv .nav button:hover{background:rgba(60,64,68,.7)}
.sv .nav button:disabled{opacity:.34;cursor:default}
.sv .nav button.on{background:#F2EFE6;color:#16181A;border-color:#F2EFE6}
.sv .nav .route{flex:1;min-width:0;text-align:center;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.08em;color:#A9A79E;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv .era{position:absolute;right:14px;top:56px;z-index:3;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.14em;color:#8F8D85;pointer-events:none}
@media (max-width:560px){
  .sv .cap{font-size:12px;bottom:64px}
  .sv .nav button.wide{display:none}
}

/* ---------- toast ----------------------------------------------------------------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);z-index:60;
  background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:10.5px;
  letter-spacing:.05em;padding:9px 14px;border-radius:9px;opacity:0;
  transition:opacity .18s ease,transform .18s ease;pointer-events:none;max-width:90vw;
  text-align:center}
.toast.on{opacity:.96;transform:translate(-50%,0)}

@media (max-width:520px){
  .key{font-size:9.5px;top:52px}
  .sheet{width:calc(100vw - 80px)}
  .srch{flex-basis:150px}
  .hdr h1{font-size:13.5px}
  .hdr p{display:none}
  .sheetsw a{padding:6px 6px;font-size:8.5px}
}

/* ---------- street-view era cross-fade -------------------------------------------- */
.sv .intact{opacity:0;transition:opacity .4s ease}
.sv .decay{opacity:1;transition:opacity .4s ease}
.sv.then .intact{opacity:1}
.sv.then .decay{opacity:0}
.sv.then .frame svg{filter:saturate(1.14) brightness(1.06)}
.sv .frame svg{transition:filter .4s ease}
@media (max-height:640px){ .ctl button{width:40px;height:34px} }

/* ---------- map labels: laid out in map space, sized in screen space -------------- */
#map .mlab{font-family:var(--cond);font-weight:500;fill:#2C2C2A;
  stroke:var(--paper);stroke-width:.28em;paint-order:stroke;stroke-linejoin:round}
#map .mlab.dist{font-weight:600;fill:#1F1F1D;letter-spacing:.06em}
#map .slab,#map .tlab{font-family:var(--mono);fill:#3A3A36;fill-opacity:.8;
  letter-spacing:.05em;stroke:var(--paper);stroke-width:.3em;paint-order:stroke;
  stroke-linejoin:round}
#map .tlab{fill-opacity:.9}
#map .ulab{font-family:var(--cond);font-weight:600;fill:#5A2C6B;
  stroke:var(--paper);stroke-width:.3em;paint-order:stroke;stroke-linejoin:round}
#map .star{fill:var(--mark);stroke:var(--paper);stroke-width:.26em;paint-order:stroke}
#map .sym{transform-box:fill-box;transform-origin:50% 50%;transform:scale(var(--symk,1))}
#map .usym{transform-box:fill-box;transform-origin:50% 100%;transform:scale(var(--symk,1))}

/* ---------- the projection console ------------------------------------------------ */
#stage.picking{cursor:crosshair}
#stage.picking::after{content:"";position:fixed;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 3px var(--z1);opacity:.5}

.simp{position:fixed;top:0;left:0;bottom:0;width:min(354px,90vw);z-index:33;
  background:var(--panel);border-right:1px solid var(--rule);backdrop-filter:blur(10px);
  transform:translateX(-101%);transition:transform .22s ease;display:flex;
  flex-direction:column}
.simp.on{transform:none}
.simp header{padding:12px 14px 10px;border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:8px}
.simp header h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.03em;flex:1}
.simp header button{border:0;background:transparent;font-size:17px;color:var(--muted);
  cursor:pointer;line-height:1;padding:2px 4px}
.simp .body{flex:1;overflow:auto;padding:10px 13px 22px}

.hgrid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.hgrid .ghead{width:100%;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  color:var(--muted);margin:6px 0 2px}
.hgrid .ghead:first-child{margin-top:0}
.chip{border:1px solid var(--rule);border-radius:7px;background:#fff;cursor:pointer;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:6px 9px}
.chip:hover{background:#F2F0E7}
.chip[aria-pressed="true"]{background:var(--z1);color:#fff;border-color:var(--z1)}
.simp .hname{margin:10px 0 3px;font-size:14px;font-weight:600}
.simp .blurb{margin:0 0 12px;font-size:12px;line-height:1.5;color:#55554F}

.prow{margin-bottom:11px}
.prow label{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--muted);
  margin-bottom:3px}
.prow label b{color:var(--ink);font-size:11px;letter-spacing:.02em}
.prow input[type=range]{width:100%;accent-color:var(--z1);height:18px}

.pointrow{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.pointrow button{height:30px;border:1px solid var(--rule);border-radius:8px;background:#fff;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;cursor:pointer}
.pointrow button[aria-pressed="true"]{background:var(--z1);color:#fff;border-color:var(--z1)}
.pointrow span{font-family:var(--mono);font-size:9.5px;color:var(--muted);line-height:1.5}
button.run{width:100%;height:38px;border:1px solid var(--ink);border-radius:9px;
  background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;cursor:pointer}
button.run:hover{background:#3E3E3A}
button.run:disabled{opacity:.5;cursor:default}

.rep{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
.repnarr{font-size:12.5px;line-height:1.55;color:#3E3E3A;margin-bottom:12px}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin-bottom:6px}
.legrow{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:9px;
  color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.legrow i,.svc i,.worst i,.counts i{display:inline-block;width:8px;height:8px;
  border-radius:2px;margin-right:4px;vertical-align:0}
.rep h4{margin:14px 0 5px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  color:var(--muted);font-weight:600}
.rep p{margin:0;font-size:12px;line-height:1.5;color:#4A4A45}
.rep ul{list-style:none;margin:0;padding:0}
.rep .svc li{display:flex;justify-content:space-between;font-size:11.5px;
  padding:3px 0;border-bottom:1px dotted var(--rule)}
.rep .svc li b{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em}
.rep .svc li span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.rep .worst li{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 0}
.rep .worst li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep .worst li b{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;
  color:var(--muted)}
.rep .foot{margin-top:14px;font-family:var(--mono);font-size:9px;line-height:1.6;
  color:var(--muted);border-top:1px solid var(--rule);padding-top:8px}

/* ---------- the hour scrubber ------------------------------------------------------ */
.timeline{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);
  bottom:14px;z-index:28;display:flex;align-items:center;gap:9px;
  background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  padding:8px 12px;backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(44,44,42,.14);
  transition:transform .22s ease,opacity .22s ease;
  width:min(560px,calc(100vw - 130px));flex-wrap:wrap;opacity:0;pointer-events:none}
.timeline.on{transform:translateX(-50%);opacity:1;pointer-events:auto}
.timeline button{height:28px;min-width:30px;border:1px solid var(--rule);border-radius:7px;
  background:#fff;cursor:pointer;font-size:11px;font-family:var(--mono)}
.timeline button.txt{font-size:9px;letter-spacing:.06em}
.timeline input[type=range]{flex:1;min-width:120px;accent-color:var(--z1)}
.timeline .hh{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
  min-width:44px;text-align:center}
.timeline .counts{font-family:var(--mono);font-size:10px;color:#4A4A45;
  display:flex;align-items:center;gap:3px}
.timeline .counts i{margin-left:5px}
.timeline .log{width:100%;max-height:74px;overflow:auto;border-top:1px solid var(--rule);
  padding-top:5px;margin-top:1px}
.timeline .log:empty{display:none}
.timeline .ev{font-size:11px;line-height:1.45;color:#4A4A45}
.timeline .ev b{font-family:var(--mono);font-size:9px;color:var(--muted);margin-right:5px}
.timeline .ev.loss{color:var(--z1)}
.timeline .ev.hazard{color:#8A5A1A}
.sheet .proj{margin-top:8px;padding-top:8px;border-top:1px dotted var(--rule);
  font-family:var(--mono);font-size:10px;letter-spacing:.04em}
.sheet .proj b{display:inline-block;padding:2px 6px;border-radius:4px;color:#fff;
  font-size:9.5px;margin-right:6px}

@media (max-width:620px){
  .timeline{width:calc(100vw - 24px);left:12px;transform:translateY(140%);
    bottom:70px}
  .timeline.on{transform:none}
  .simp{width:100vw}
}
#map .hbar{transform-box:fill-box;transform-origin:50% 100%;
  transform:scale(var(--symk,1))}

/* ---------- the debris section elevation ------------------------------------------ */
.secthead{display:flex;justify-content:space-between;align-items:center;gap:6px;
  margin:14px 0 5px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  color:var(--muted)}
.secthead span{display:flex;gap:3px}
.fsel{border:1px solid var(--rule);border-radius:5px;background:#fff;cursor:pointer;
  font-family:var(--mono);font-size:8px;letter-spacing:.05em;padding:3px 5px;
  color:var(--muted)}
.fsel.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
svg.sect{width:100%;height:auto;display:block;background:#F3F1E8;
  border:1px solid var(--rule);border-radius:8px}
svg.sect .gl{stroke:#8A8377;stroke-width:1}
svg.sect .tk{stroke:#B4AC9C;stroke-width:1}
svg.sect .ax{font-family:var(--mono);font-size:7px;fill:#8A8377;text-anchor:middle}
svg.sect .bd{fill:#C2BBA8;stroke:#9A9282;stroke-width:.6}
svg.sect .bd.hit{fill:#D8A66E}
svg.sect .bd.thru{fill:#C4472A}
svg.sect .traj{fill:none;stroke:#2C2C2A;stroke-width:1.3;stroke-dasharray:3 2}
svg.sect .stk{fill:#8F2222}
svg.sect .stk.thru{fill:#B4741A;stroke:#8F2222;stroke-width:.8}
svg.sect .land{fill:none;stroke:#2C2C2A;stroke-width:1.4}
.secap{font-family:var(--mono);font-size:9px;line-height:1.6;color:#55554F;
  margin-top:5px}
svg.sect .bd.log{stroke:#2C2C2A;stroke-width:1}
svg.sect .bl{font-family:var(--mono);font-size:6px;fill:#3A3A36;text-anchor:start}
.seckey{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:5px;
  font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:.04em}
.seckey i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-left:6px}
.seckey i.k1{background:#C2BBA8}
.seckey i.k2{background:#D8A66E}
.seckey i.k3{background:#C4472A}
svg.sect .ax.lft{text-anchor:start}
.erabar{display:flex;align-items:flex-end;gap:4px;margin-top:8px;height:60px}
.erabar span{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;gap:2px}
.erabar i{display:block;width:100%;border-radius:2px 2px 0 0}
.erabar b{font-family:var(--mono);font-size:9px;color:var(--ink)}
.erabar em{font-family:var(--mono);font-size:6.5px;font-style:normal;
  color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.erafoot{font-family:var(--mono);font-size:8px;color:var(--muted);margin-top:3px}

/* ---------- the route console ----------------------------------------------------- */
.rtp .body{padding-top:14px}
.rtfield{position:relative;margin-bottom:2px}
.rtfield label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  color:var(--muted);margin-bottom:3px}
.rtrow{display:flex;gap:5px}
.rtrow input{flex:1;height:32px;border:1px solid var(--rule);border-radius:8px;
  padding:0 9px;font-family:var(--cond);font-size:13px;background:#fff;color:var(--ink)}
.rtrow input:focus{outline:2px solid var(--ink);outline-offset:-1px}
.rtrow button{width:34px;border:1px solid var(--rule);border-radius:8px;background:#fff;
  cursor:pointer;font-size:13px;color:var(--muted)}
.rtrow button[aria-pressed="true"]{background:var(--z1);color:#fff;border-color:var(--z1)}
.rtfield .res{top:58px}
.rtswap{display:block;margin:4px 0 4px auto;width:28px;height:22px;border:1px solid var(--rule);
  border-radius:6px;background:#fff;cursor:pointer;font-size:12px;color:var(--muted)}
.rttog{width:100%;margin:10px 0 8px;min-height:30px;padding:6px 8px;border:1px solid var(--rule);
  border-radius:8px;background:#fff;font-family:var(--mono);font-size:9px;
  letter-spacing:.06em;cursor:pointer;color:var(--muted);line-height:1.4}
.rttog[aria-pressed="true"]{background:var(--z2);color:#fff;border-color:var(--z2)}
.rtbtns{display:flex;gap:6px}
.rtbtns .run{flex:1}
.rtclear{width:74px;border:1px solid var(--rule);border-radius:9px;background:#fff;
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;cursor:pointer}

.rtcard{border:1px solid var(--rule);border-radius:10px;background:#fff;padding:9px 10px;
  margin-top:9px;cursor:pointer}
.rtcard.on{border-color:var(--ink);box-shadow:0 2px 10px rgba(44,44,42,.1)}
.rtcard:hover{background:#F9F7EF}
.rth{display:flex;align-items:center;gap:6px;font-size:12px}
.rth i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.rth b{flex:1;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em}
.rth span{font-size:13px;font-weight:600}
.rtm{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:3px;
  letter-spacing:.03em}
.rtbar{height:4px;border-radius:2px;background:#E6E3D8;margin-top:6px;overflow:hidden}
.rtbar i{display:block;height:100%;background:linear-gradient(90deg,#3F6B3A,#E08A24,#8F2222)}
.rtw{margin:7px 0 0;padding-left:14px;font-size:11.5px;line-height:1.45;color:var(--z1)}
.rtlegs{margin:9px 0 0;padding-left:0;list-style:none;counter-reset:leg;
  border-top:1px solid var(--rule);padding-top:7px}
.rtlegs li{counter-increment:leg;position:relative;padding:5px 0 5px 20px;
  border-bottom:1px dotted var(--rule)}
.rtlegs li:last-child{border-bottom:0}
.rtlegs li::before{content:counter(leg);position:absolute;left:0;top:6px;
  font-family:var(--mono);font-size:8.5px;color:var(--muted)}
.rtlegs b{display:block;font-size:12px;font-weight:600}
.rtlegs span{font-family:var(--mono);font-size:9px;color:var(--muted)}
.rtlegs em{display:block;font-style:normal;font-family:var(--mono);font-size:9px;
  color:var(--z1);margin-top:2px}
.rterr{border:1px solid var(--z1);border-radius:9px;background:#FAF2EF;padding:10px;
  font-size:12.5px;line-height:1.5;color:var(--z1);margin-top:10px}
.rtfoot{font-family:var(--mono);font-size:8.5px;line-height:1.6;color:var(--muted);
  margin-top:12px;border-top:1px solid var(--rule);padding-top:7px}
#map .rline{vector-effect:non-scaling-stroke}

/* ===================================================================================
   Adrinem plate — the second sheet. Everything above is shared; this is only what
   another world needs that a flooded New York did not.
   =================================================================================== */
.sheetsw{display:flex;gap:0;border:1px solid var(--rule);border-radius:8px;overflow:hidden;
  flex:0 0 auto}
.sheetsw a{display:block;padding:6px 9px;font-family:var(--mono);font-size:9px;
  letter-spacing:.06em;color:var(--muted);text-decoration:none;background:#fff;
  white-space:nowrap}
.sheetsw a+a{border-left:1px solid var(--rule)}
.sheetsw a:hover{background:#F2F0E7}
.sheetsw a.on{background:var(--ink);color:var(--paper)}

/* the plate's own labels */
#map .grat{font-family:var(--mono);fill:#2C2C2A;fill-opacity:.4;letter-spacing:.06em}
#map .burglab{font-family:var(--cond);font-weight:600;fill:#24241F;
  stroke:var(--paper);stroke-width:.3em;paint-order:stroke;stroke-linejoin:round}
#map .realmlab{font-family:var(--cond);font-weight:600;fill:#4A463C;fill-opacity:.72;
  letter-spacing:.22em;text-anchor:middle;font-size:1.85em;
  stroke:var(--paper);stroke-width:.22em;paint-order:stroke;stroke-linejoin:round}

/* the drawer's index rows and the account */
.drawer .grp{margin:14px 0 5px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:4px}
.drawer .grp:first-child{margin-top:2px}
.drawer .row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #EAE8DF;
  background:transparent;padding:7px 4px;cursor:pointer}
.drawer .row:hover{background:#F2F0E7}
.drawer .row b{display:block;font-size:13px;font-weight:600}
.drawer .row span{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);
  letter-spacing:.04em;margin-top:1px}
.drawer .row i{display:block;font-style:normal;font-size:11.5px;color:#55554F;
  line-height:1.4;margin-top:3px}
dl.acct{margin:0;font-family:var(--mono);font-size:10px}
dl.acct dt{float:left;clear:left;color:var(--muted);letter-spacing:.03em}
dl.acct dd{margin:0 0 3px;text-align:right;color:var(--ink);font-weight:600}
.lm{border-bottom:1px dotted var(--rule);padding:6px 0}
.lm b{display:block;font-family:var(--cond);font-size:12.5px}
.lm span{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);
  line-height:1.5}

/* ---------- the city plate --------------------------------------------------------- */
.cityplate{position:fixed;inset:0;z-index:45;background:#E7E2CE;display:none}
.cityplate.on{display:block}
.cphdr{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;
  gap:10px;padding:9px 12px 8px;background:rgba(250,249,245,.94);
  border-bottom:1px solid var(--rule);backdrop-filter:blur(8px)}
.cpttl{flex:1;min-width:0}
.cpttl h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpttl p{margin:2px 0 0;font-size:10px;color:var(--muted);font-family:var(--mono);
  letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cphdr button{border:0;background:transparent;font-size:20px;color:var(--muted);
  cursor:pointer;line-height:1;padding:0 4px}
#cpStage{position:absolute;inset:0;touch-action:none;cursor:grab}
#cpMap{width:100%;height:100%}
.cpctl{z-index:4}
.cpkey{top:60px;z-index:4}
.cpread{z-index:4;left:12px;bottom:14px}
.cpacct{position:absolute;right:70px;top:60px;width:min(310px,calc(100vw - 96px));
  max-height:calc(100vh - 92px);overflow:auto;z-index:4;background:var(--panel);
  border:1px solid var(--rule);border-radius:10px;padding:10px 12px;
  backdrop-filter:blur(8px);display:none}
.cpacct.on{display:block}
.cpacct .grp{margin:12px 0 5px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:4px}
.cpacct .empty{font-family:var(--mono);font-size:9px;color:var(--muted);line-height:1.7;
  margin:10px 0 0}
ul.why{list-style:none;margin:0;padding:0}
ul.why li{padding:5px 0;border-bottom:1px dotted var(--rule)}
ul.why li:last-child{border-bottom:0}
ul.why b{display:block;font-size:12px;font-weight:600}
ul.why span{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);
  line-height:1.5;margin-top:1px}
#cpMap .cplab{font-family:var(--cond);font-weight:600;fill:#24241F;
  stroke:#E7E2CE;stroke-width:.32em;paint-order:stroke;stroke-linejoin:round;
  pointer-events:none}
#cpMap .csym{transform-box:fill-box;transform-origin:50% 50%;
  transform:scale(var(--csymk,1))}
@media (max-width:520px){
  .cpacct{right:12px;left:12px;width:auto;top:56px}
}

/* ---------- the guided walk -------------------------------------------------------- */
.tourdim{position:fixed;inset:0;z-index:80;display:none;background:transparent;
  transition:background .18s ease}
.tourdim.solid{background:rgba(30,30,28,.60)}
.tourdim.on{display:block}
.tourhole{position:fixed;pointer-events:none;border:2px solid var(--z2);border-radius:12px;
  box-shadow:0 0 0 9999px rgba(30,30,28,.60);transition:left .22s ease,top .22s ease,
  width .22s ease,height .22s ease}
.tourcard{position:fixed;z-index:81;width:min(340px,calc(100vw - 28px));
  background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  padding:13px 15px 11px;box-shadow:0 10px 34px rgba(30,30,28,.28);
  backdrop-filter:blur(10px);opacity:0;pointer-events:none;
  transition:opacity .18s ease}
.tourcard.on{opacity:1;pointer-events:auto}
.tourcard .tt{margin:0 0 5px;font-size:14.5px;font-weight:600;letter-spacing:.01em}
.tourcard .tb{font-size:12.5px;line-height:1.5;color:#44443F}
.tourcard .tb b{font-weight:600;color:var(--ink)}
.tourcard .tb code{font-family:var(--mono);font-size:10.5px;background:#EFEDE4;
  padding:2px 5px;border-radius:4px;display:inline-block;margin:2px 0}
.tourcard .tf{display:flex;align-items:center;gap:6px;margin-top:11px;
  border-top:1px solid var(--rule);padding-top:9px}
.tourcard .tc{flex:1;font-family:var(--mono);font-size:9.5px;color:var(--muted);
  letter-spacing:.06em}
.tourcard .tf button{min-height:28px;padding:0 11px;border:1px solid var(--rule);
  border-radius:8px;background:#fff;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.05em;cursor:pointer}
.tourcard .tf button:hover{background:#F2F0E7}
.tourcard .tnext{background:var(--ink)!important;color:var(--paper);
  border-color:var(--ink)!important}
.tourcard .tskip{color:var(--muted)}
@media (max-width:520px){
  .tourcard{width:calc(100vw - 24px)}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="sheetsw">
    <a href="nyc2050.html">NYC 2050</a>
    <a href="adrinem.html" class="on" aria-current="page">ADRINEM</a>
  </div>
  <div class="ttl">
    <h1>Adrinem — Infrastructure Plate</h1>
    <p id="hdrSub">READING THE PLATE…</p>
  </div>
  <div class="srch" id="srch">
    <input id="search" type="search" placeholder="Search the world  ( / )"
      autocomplete="off" spellcheck="false" aria-label="Search burgs, realms and peoples">
    <button class="sx" id="searchClear" aria-label="Clear search">&times;</button>
    <div class="res" id="results"></div>
  </div>
</div>

<div id="stage"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div>

<div class="key" id="key"></div>

<div class="sheet" id="sheet">
  <button class="x" id="closeSheet" aria-label="Close">&times;</button>
  <p class="nm" id="sNm"></p>
  <p class="meta" id="sMeta"></p>
  <span class="code" id="sCode"></span>
  <p class="note" id="sNote"></p>
  <div class="acts" id="sActs"></div>
</div>

<div class="ctl">
  <button id="keyBtn" class="sm" aria-pressed="false" aria-label="Toggle the key">KEY</button>
  <button id="grndBtn" class="sm" aria-label="Cycle what the ground is coloured by">BIOM</button>
  <button id="rdBtn" class="sm" aria-pressed="true" aria-label="Toggle the trade network">RDS</button>
  <button id="rivBtn" class="sm" aria-pressed="true" aria-label="Toggle rivers">RIV</button>
  <button id="brdBtn" class="sm" aria-pressed="true" aria-label="Toggle realm and province marches">BRD</button>
  <button id="grtBtn" class="sm" aria-pressed="false" aria-label="Toggle the graticule">GRT</button>
  <button id="wayBtn" class="sm" aria-pressed="false" aria-label="Find a way across">WAY</button>
  <button id="reachBtn" class="sm" aria-pressed="false" aria-label="Cast a reach">RCH</button>
  <button id="pinBtn" class="sm" aria-pressed="false" aria-label="Drop a mark">PIN</button>
  <button id="listBtn" class="sm" aria-pressed="false" aria-label="Open the index">LIST<span
    class="badge" id="pinCount">0</span></button>
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">&minus;</button>
  <button id="rst" class="sm" aria-label="Reset the view">RST</button>
</div>

<div class="drawer" id="drawer">
  <header>
    <h2 id="drawerTitle">Index of the world</h2>
    <button id="drawerClose" aria-label="Close panel">&times;</button>
  </header>
  <div class="tabs">
    <button id="tabIndex" aria-selected="true">INDEX</button>
    <button id="tabMarks" aria-selected="false">MY MARKS</button>
    <button id="tabAccount" aria-selected="false">ACCOUNT</button>
  </div>
  <div class="body" id="drawerBody"></div>
  <div class="foot" id="drawerFoot" style="display:none">
    <button id="mkCopy">COPY</button>
    <button id="mkPaste">IMPORT</button>
    <button id="mkClear">CLEAR</button>
  </div>
</div>

<div class="simp rtp" id="wayPanel">
  <header>
    <h2>Find a way across</h2>
    <button id="wayClose" aria-label="Close the way console">&times;</button>
  </header>
  <div class="body">
    <div class="rtfield">
      <label for="wFrom">FROM</label>
      <div class="rtrow">
        <input id="wFrom" autocomplete="off" spellcheck="false" placeholder="Search, or set on the plate">
        <button id="wFromPick" aria-pressed="false" title="Set on the plate">&#9678;</button>
      </div>
      <div class="res" id="wFromRes"></div>
    </div>
    <button class="rtswap" id="wSwap" aria-label="Swap the ends">&#8645;</button>
    <div class="rtfield">
      <label for="wTo">TO</label>
      <div class="rtrow">
        <input id="wTo" autocomplete="off" spellcheck="false" placeholder="Search, or set on the plate">
        <button id="wToPick" aria-pressed="false" title="Set on the plate">&#9678;</button>
      </div>
      <div class="res" id="wToRes"></div>
    </div>
    <div class="rtbtns">
      <button id="wPlan" class="run">FIND A WAY</button>
      <button id="wClear" class="rtclear">CLEAR</button>
    </div>
    <div id="wOut"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="editor" id="editor">
  <h3 id="edTitle">New mark</h3>
  <p class="loc" id="edLoc"></p>
  <label for="edName">NAME</label>
  <input id="edName" maxlength="60" placeholder="Ford, waystation, the pass east…">
  <label for="edNote">NOTE</label>
  <textarea id="edNote" maxlength="600" placeholder="What you want to remember about this ground."></textarea>
  <div class="btns">
    <button id="edSave" class="pri">SAVE</button>
    <button id="edCancel">CANCEL</button>
    <button id="edDel" class="del">DELETE</button>
  </div>
</div>

<div class="cityplate" id="cityPlate">
  <div class="cphdr">
    <div class="cpttl">
      <h2 id="cpName"></h2>
      <p id="cpSub"></p>
    </div>
    <button id="cpClose" aria-label="Leave the city plate">&times;</button>
  </div>
  <div id="cpStage"><svg id="cpMap" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="key cpkey" id="cpKey"></div>
  <div class="cpacct" id="cpAcct"></div>
  <div class="sheet cpread" id="cpRead">
    <button class="x" id="cpReadX" aria-label="Close">&times;</button>
    <p class="nm" id="cpRNm"></p>
    <p class="meta" id="cpRMeta"></p>
    <span class="code" id="cpRCode"></span>
    <p class="note" id="cpRNote"></p>
  </div>
  <div class="ctl cpctl">
    <button id="cpKeyBtn" class="sm" aria-pressed="false" aria-label="Toggle the key">KEY</button>
    <button id="cpFabBtn" class="sm" aria-label="Colour the fabric by">USE</button>
    <button id="cpAcctBtn" class="sm" aria-pressed="false" aria-label="The account">ACCT</button>
    <button id="cpIn" aria-label="Zoom in">+</button>
    <button id="cpOut" aria-label="Zoom out">&minus;</button>
    <button id="cpRst" class="sm" aria-label="Reset the view">RST</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================================================================================
   Adrinem — the packed world. Generated by tools/pack_adrinem.py from the exports at
   the repository root (cells.csv, roads.geojson, markets.geojson, ports.csv,

  "Cold desert":"#DCD3B8",
  "Hot desert":"#E7D6A0",
  "Barrens":"#CBC1A8",
  "Grassland":"#C9D29B",
  "Savanna":"#DACB8E",
  "Wetland":"#A3B99B",
  "Coastal":"#D6D4B6",
  "Taiga":"#9AB096",

  "Temperate rainforest":"#82A67A",

};

/* The fourteen realms. Neutrals is left the colour of bare paper on purpose. */
const REALM={
  "Neutrals":"#D9D6C8",
  "Asra":"#C98A5E", "Cutho":"#8FA9C4", "Remoore":"#A8B96A", "Boru":"#C4A24E",

  "DRAGON RIDGERS":"#9E86C0", "HALFLINGS":"#C4B48C"
};

/* Seventeen catchments; picked to stay apart from their neighbours on the sheet. */
const CATCH=["#C98A5E","#7FA890","#8FA9C4","#C4A24E","#B2718F","#A8B96A","#9E86C0",
  "#5F8C93","#88B071","#D3A05F","#A0B8CE","#8C8676","#B06B6B","#6E9AA8","#BFA05A",
  "#94A870","#AE8FA8"];

/* Sequential ramps. Nine steps: enough to read a gradient, few enough to keep the
   ground layer down to nine paths. */
const RELIEF=["#B9C99B","#C3CE9A","#CDD199","#D5CE95","#D8C48A","#D4B47C","#C79E6D",
  "#B5896A","#D8D2CC"];
const SUPPLY=["#3F6B5A","#5B8168","#7B9878","#9BAE89","#BBC49E","#D3D2B0","#E2DCBF",

  "#6DA952","#569A45"];

const step=(ramp,t)=>ramp[Math.max(0,Math.min(ramp.length-1,Math.floor(t*ramp.length)))];

A.palette={
  biome:n=>BIOME[n]||"#C9C6B6",
  realm:n=>REALM[n]||"#CFCCBE",
  culture:n=>CULTURE[n]||"#D2CFC2",
  catchment:i=>CATCH[i%CATCH.length],
  RELIEF:RELIEF, SUPPLY:SUPPLY, DENSITY:DENSITY, HAB:HAB, CATCH:CATCH,
  BIOME:BIOME, REALM:REALM, CULTURE:CULTURE,
  step:step,
  sea:"#7C97A6", shelf:"#93A9B4", deep:"#6B8695",
  ink:"#2C2C2A", paper:"#FAF9F5",
  road:{trunk:"#7A4A22", road:"#8E6134", trail:"#9C8258"},
  river:"#4E7C96"

<script>
/* ===================================================================================
   Adrinem — the world, unpacked. Turns the columns in adrinem-data.js back into a
   cell table, rebuilds each cell's ground from its centroid, and derives the things
   the sheet draws off that: the coast, the realm and province marches, the rivers,
   and the adjacency the way-finder runs over.

   The exports carry a point per cell, not a polygon. The ground is recovered the way
   the generator made it in the first place — as a Voronoi diagram — by clipping the
   map frame with the perpendicular bisector to every near neighbour. Which bisectors
   survive that clip is exactly the cell's neighbour list, so the adjacency the router
   needs falls out of the same pass.
   =================================================================================== */
(function(){
"use strict";
const A=window.ADRINEM=window.ADRINEM||{};
const D=window.ADRINEM_DATA;

const nums=s=>{ if(!s) return []; const p=s.split(","), a=new Float64Array(p.length);
  for(let i=0;i<p.length;i++) a[i]=+p[i]; return a; };
const ints=s=>{ if(!s) return []; const p=s.split(","), a=new Int32Array(p.length);
  for(let i=0;i<p.length;i++) a[i]=+p[i]; return a; };

/* ---- the cell table --------------------------------------------------------------- */
const C={
  x:nums(D.cols.x), y:nums(D.cols.y), h:ints(D.cols.h), b:ints(D.cols.b),
  st:ints(D.cols.st), pv:ints(D.cols.pv), cu:ints(D.cols.cu), pop:ints(D.cols.pop),
  riv:ints(D.cols.riv), flux:ints(D.cols.flux), hrb:ints(D.cols.hrb),
  mkt:ints(D.cols.mkt), cost:nums(D.cols.cost)
};
const N=C.x.length;
const M=D.meta;
const isLand=i=>C.h[i]>=M.seaLevel;

/* lon/lat is a linear function of the map frame; the packer kept the transform */
const lonOf=x=>M.lonW+M.lonPer*x, latOf=y=>M.latN+M.latPer*y;

/* ---- roads, as cell pairs --------------------------------------------------------- */
const R={a:ints(D.roads.a), b:ints(D.roads.b), cls:ints(D.roads.cls), uses:ints(D.roads.uses)};

/* ---- market lookup ---------------------------------------------------------------- */
const marketByCell=new Map(); D.markets.forEach(m=>marketByCell.set(m.cell,m));
const burgOfCell=new Map(); for(const k in D.burgOfCell) burgOfCell.set(+k,D.burgs[D.burgOfCell[k]]);
const portOfCell=new Map(); for(const k in D.ports) portOfCell.set(+k,D.ports[k]);

/* =================================================================================== */
/*  the frame, and a bucket grid over the sites                                        */
/* =================================================================================== */
let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
for(let i=0;i<N;i++){
  if(C.x[i]<minX)minX=C.x[i]; if(C.x[i]>maxX)maxX=C.x[i];
  if(C.y[i]<minY)minY=C.y[i]; if(C.y[i]>maxY)maxY=C.y[i];
}
/* mean spacing, from area per site — the sites came off a jittered grid */
const SPACING=Math.sqrt((maxX-minX)*(maxY-minY)/N);
const PAD=SPACING*0.6;
const FRAME={x0:minX-PAD, y0:minY-PAD, x1:maxX+PAD, y1:maxY+PAD};

const GS=SPACING*2;                     /* bucket side */
const GW=Math.ceil((FRAME.x1-FRAME.x0)/GS)+1, GH=Math.ceil((FRAME.y1-FRAME.y0)/GS)+1;
const buckets=new Array(GW*GH);
const bucketOf=(x,y)=>{
  const cx=Math.min(GW-1,Math.max(0,Math.floor((x-FRAME.x0)/GS)));
  const cy=Math.min(GH-1,Math.max(0,Math.floor((y-FRAME.y0)/GS)));
  return cy*GW+cx;
};
for(let i=0;i<N;i++){ const k=bucketOf(C.x[i],C.y[i]); (buckets[k]||(buckets[k]=[])).push(i); }

function near(x,y,radius,out){
  out.length=0;
  const r=Math.ceil(radius/GS);
  const cx=Math.floor((x-FRAME.x0)/GS), cy=Math.floor((y-FRAME.y0)/GS);
  const r2=radius*radius;
  for(let gy=cy-r;gy<=cy+r;gy++){
    if(gy<0||gy>=GH) continue;
    for(let gx=cx-r;gx<=cx+r;gx++){
      if(gx<0||gx>=GW) continue;
      const list=buckets[gy*GW+gx]; if(!list) continue;
      for(let n=0;n<list.length;n++){
        const j=list[n], dx=C.x[j]-x, dy=C.y[j]-y;
        if(dx*dx+dy*dy<=r2) out.push(j);
      }
    }
  }
  return out;
}
/* nearest site to an arbitrary point — how a tap on the sheet becomes a cell */
function cellAt(x,y){
  let best=-1,bd=Infinity,radius=SPACING*1.5;
  const bag=[];
  for(let pass=0;pass<6&&best<0;pass++,radius*=2){
    near(x,y,radius,bag);
    for(let n=0;n<bag.length;n++){
      const j=bag[n], dx=C.x[j]-x, dy=C.y[j]-y, d=dx*dx+dy*dy;
      if(d<bd){bd=d;best=j;}
    }
  }
  return best;
}

/* =================================================================================== */
/*  Voronoi: clip the frame by every bisector that bites                               */
/* =================================================================================== */
/* A polygon is held as flat [x0,y0,x1,y1,...] with own[k] naming the neighbour whose
   bisector produced the edge leaving vertex k (-1 for an edge of the frame itself). */
function clip(pts,own,px,py,jx,jy,j){
  const mx=(px+jx)/2, my=(py+jy)/2, dx=jx-px, dy=jy-py;
  const side=(x,y)=>(x-mx)*dx+(y-my)*dy;      /* <= 0 keeps the site's half */
  const n=pts.length/2;
  const outP=[], outO=[];
  let bit=false;
  for(let k=0;k<n;k++){
    const ax=pts[2*k], ay=pts[2*k+1], o=own[k];
    const k2=(k+1)%n, bx=pts[2*k2], by=pts[2*k2+1];
    const sa=side(ax,ay), sb=side(bx,by);
    const ai=sa<=0, bi=sb<=0;
    if(!ai||!bi) bit=true;
    if(ai&&bi){ outP.push(ax,ay); outO.push(o); }
    else if(ai&&!bi){
      const t=sa/(sa-sb);
      outP.push(ax,ay); outO.push(o);
      outP.push(ax+(bx-ax)*t, ay+(by-ay)*t); outO.push(j);
    } else if(!ai&&bi){
      const t=sa/(sa-sb);
      outP.push(ax+(bx-ax)*t, ay+(by-ay)*t); outO.push(o);
    }
  }
  return bit?{pts:outP,own:outO}:null;
}

let POLY=null, OWN=null, ADJ=null;

function buildGround(){
  if(POLY) return;
  POLY=new Array(N); OWN=new Array(N); ADJ=new Array(N);
  const bag=[];
  for(let i=0;i<N;i++){
    const px=C.x[i], py=C.y[i];
    let radius=SPACING*2.2, pts, own;
    /* the clip is only trustworthy once the search radius covers twice the farthest
       vertex; anything nearer could still be cut by a site we never looked at */
    for(let pass=0;pass<7;pass++){
      pts=[FRAME.x0,FRAME.y0, FRAME.x1,FRAME.y0, FRAME.x1,FRAME.y1, FRAME.x0,FRAME.y1];
      own=[-1,-1,-1,-1];
      near(px,py,radius,bag);
      for(let n=0;n<bag.length;n++){
        const j=bag[n]; if(j===i) continue;
        const res=clip(pts,own,px,py,C.x[j],C.y[j],j);
        if(res){ pts=res.pts; own=res.own; if(pts.length<6) break; }
      }
      let far=0;
      for(let k=0;k<pts.length;k+=2){
        const d=Math.hypot(pts[k]-px,pts[k+1]-py); if(d>far) far=d;
      }
      if(radius>=2*far) break;
      radius=2*far+SPACING;
    }
    POLY[i]=pts; OWN[i]=own;
    const nb=[];
    for(let k=0;k<own.length;k++) if(own[k]>=0&&nb.indexOf(own[k])<0) nb.push(own[k]);
    ADJ[i]=nb;
  }
  /* the clip is symmetric in theory and all but symmetric in floating point; make it
     so, since the router walks it in both directions */
  for(let i=0;i<N;i++) for(const j of ADJ[i]) if(ADJ[j].indexOf(i)<0) ADJ[j].push(i);
}

/* =================================================================================== */
/*  what the sheet draws off the ground                                                */
/* =================================================================================== */
/* every edge of the diagram, once, tagged with the two cells it divides */
function edges(){
  buildGround();
  const out=[];
  for(let i=0;i<N;i++){
    const pts=POLY[i], own=OWN[i], n=pts.length/2;
    for(let k=0;k<n;k++){
      const j=own[k];
      /* the same segment sits in both cells' outlines, so only the lower id emits it —
         unless the clip was not quite symmetric, in which case nobody else will */
      if(j>=0&&j<i&&OWN[j].indexOf(i)>=0) continue;
      const k2=(k+1)%n;
      out.push({a:i, b:j, x1:pts[2*k], y1:pts[2*k+1], x2:pts[2*k2], y2:pts[2*k2+1]});
    }
  }
  return out;
}

/* rivers: each river cell drains to the neighbour carrying it onward — the one of its
   own river with more flux, failing that the sea, failing that the fullest neighbour */
function rivers(){
  buildGround();
  const segs=[];
  for(let i=0;i<N;i++){
    if(!C.riv[i]||!isLand(i)) continue;
    let best=-1,bestScore=-1;
    for(const j of ADJ[i]){
      let score;
      if(!isLand(j)) score=1e9;                                   /* a mouth */
      else if(C.riv[j]===C.riv[i]&&C.flux[j]>C.flux[i]) score=1e8-C.flux[j];
      else if(C.riv[j]&&C.flux[j]>C.flux[i]) score=1e7-C.flux[j]; /* a confluence */
      else continue;
      if(score>bestScore){bestScore=score;best=j;}
    }
    if(best<0) continue;
    segs.push({x1:C.x[i], y1:C.y[i], x2:C.x[best], y2:C.y[best],
      flux:C.flux[i], mouth:!isLand(best), river:C.riv[i]});
  }
  return segs;
}

/* =================================================================================== */
A.data=D;
A.meta=M;
A.cells=C;
A.count=N;
A.roads=R;
A.frame=FRAME;
A.spacing=SPACING;
A.isLand=isLand;
A.lonOf=lonOf; A.latOf=latOf;
A.biomeOf=i=>D.biomes[C.b[i]];
A.stateOf=i=>D.states[C.st[i]]||"Unclaimed";
A.provinceOf=i=>D.provinces[C.pv[i]]||"";
A.cultureOf=i=>D.cultures[C.cu[i]]||"Wildlands";
A.burgOf=i=>burgOfCell.get(i)||null;
A.marketOf=i=>marketByCell.get(i)||null;
A.portOf=i=>portOfCell.get(i)||null;
A.markets=D.markets;
A.burgs=D.burgs;
A.marketByCell=marketByCell;
A.build=buildGround;
A.polyOf=i=>{buildGround();return POLY[i];};
A.neighboursOf=i=>{buildGround();return ADJ[i];};
A.edges=edges;
A.rivers=rivers;
A.cellAt=cellAt;
A.near=near;
/* effective miles a day on the road, from the generator's own supply figure */
A.daysOf=mi=>mi/M.supplyDivisor;
})();
</script>
<script>
/* ===================================================================================
   Adrinem — the way across. The same cost model adrinem_infra.py used to lay the
   trade network, run in the browser over the adjacency the Voronoi pass recovered,
   so a route asked for on the sheet is priced exactly as the exported network was.

       cost(a -> b) = miles(a,b) * terrain(b) * slope(a,b) + river(a,b)

   terrain is the biome's own cost against grassland, slope is the climb into b over
   the divisor that doubles it, and river is the toll for fording onto a river cell
   from dry ground. Water is not passable: sea legs are a separate trade, and the
   sheet says which harbours they would have to leave from.
   =================================================================================== */
(function(){
"use strict";
const A=window.ADRINEM=window.ADRINEM||{};
const C=A.cells, M=A.meta, D=A.data;

const BIOME_COST=D.biomes.map(b=>b.cost);

function miles(a,b){
  return Math.hypot(C.x[b]-C.x[a],C.y[b]-C.y[a])*M.scale;
}
function edgeCost(a,b){
  const terrain=BIOME_COST[C.b[b]]/M.baseCost;
  const slope=1+Math.max(0,C.h[b]-C.h[a])/M.slopeDivisor;
  const river=(C.riv[b]&&!C.riv[a])?M.riverCrossMi:0;
  return miles(a,b)*terrain*slope+river;
}

/* ---- a binary heap, since the graph is big enough to care ------------------------- */
function Heap(){ this.k=[]; this.v=[]; }
Heap.prototype.push=function(key,val){
  const k=this.k,v=this.v; let i=k.length; k.push(key); v.push(val);
  while(i>0){ const p=(i-1)>>1; if(k[p]<=k[i]) break;
    [k[p],k[i]]=[k[i],k[p]]; [v[p],v[i]]=[v[i],v[p]]; i=p; }
};
Heap.prototype.pop=function(){
  const k=this.k,v=this.v, top=v[0], key=k[0], last=k.length-1;
  k[0]=k[last]; v[0]=v[last]; k.pop(); v.pop();
  let i=0;
  while(true){
    const l=2*i+1, r=l+1; let s=i;
    if(l<k.length&&k[l]<k[s]) s=l;
    if(r<k.length&&k[r]<k[s]) s=r;
    if(s===i) break;
    [k[s],k[i]]=[k[i],k[s]]; [v[s],v[i]]=[v[i],v[s]]; i=s;
  }
  return {key:key,val:top};
};
Heap.prototype.size=function(){ return this.k.length; };

/* ---- least cost from one cell ----------------------------------------------------- */
function from(source,stopAt){
  A.build();
  const n=A.count;
  const dist=new Float64Array(n).fill(Infinity);
  const prev=new Int32Array(n).fill(-1);
  const done=new Uint8Array(n);
  if(!A.isLand(source)) return {dist:dist,prev:prev};
  const want=stopAt?new Set(stopAt):null;
  const h=new Heap();
  dist[source]=0; h.push(0,source);
  while(h.size()){
    const {key:d,val:u}=h.pop();
    if(done[u]) continue;
    done[u]=1;
    if(want){ want.delete(u); if(!want.size) break; }
    const nb=A.neighboursOf(u);
    for(let i=0;i<nb.length;i++){
      const v=nb[i];
      if(!A.isLand(v)||done[v]) continue;
      const nd=d+edgeCost(u,v);
      if(nd<dist[v]){ dist[v]=nd; prev[v]=u; h.push(nd,v); }
    }
  }
  return {dist:dist,prev:prev};
}

/* ---- nearest source and its cost, everywhere, in one sweep ------------------------ */
function fromMany(sources){
  A.build();
  const n=A.count;
  const dist=new Float64Array(n).fill(Infinity);
  const owner=new Int32Array(n).fill(-1);
  const done=new Uint8Array(n);
  const h=new Heap();
  sources.forEach(s=>{ if(A.isLand(s)){ dist[s]=0; owner[s]=s; h.push(0,s); } });
  while(h.size()){
    const {key:d,val:u}=h.pop();
    if(done[u]) continue;
    done[u]=1;
    const nb=A.neighboursOf(u);
    for(let i=0;i<nb.length;i++){
      const v=nb[i];
      if(!A.isLand(v)||done[v]) continue;
      const nd=d+edgeCost(u,v);
      if(nd<dist[v]){ dist[v]=nd; owner[v]=owner[u]; h.push(nd,v); }
    }
  }
  return {dist:dist,owner:owner};
}

/* ---- a named route between two cells ---------------------------------------------- */
function route(a,b){
  if(a===b) return {ok:false,why:"Both ends are the same ground."};
  if(!A.isLand(a)||!A.isLand(b))
    return {ok:false,why:"A leg of this route starts or ends in open water. "+
      "The overland network does not cross it."};
  const {dist,prev}=from(a,[b]);
  if(!isFinite(dist[b]))
    return {ok:false,why:"No overland way exists. These lie on different landmasses; "+
      "the crossing would have to be made by sea."};
  const cells=[b];
  while(cells[cells.length-1]!==a){
    const p=prev[cells[cells.length-1]];
    if(p<0) return {ok:false,why:"The way broke while being traced back."};
    cells.push(p);
  }
  cells.reverse();
  return {ok:true, cells:cells, cost:dist[b], days:A.daysOf(dist[b]),
    legs:legsOf(cells)};
}

/* Break the cell chain into legs a person would recognise: a run of one biome through
   one realm, with what it cost and what was crossed on it. */
function legsOf(cells){
  const out=[];
  let start=0;
  for(let i=1;i<=cells.length;i++){
    const last=i===cells.length;
    const cur=cells[i-1], nxt=last?-1:cells[i];
    const breaks = last || C.b[nxt]!==C.b[cur] || C.st[nxt]!==C.st[cur];
    if(!breaks) continue;
    let cost=0, fords=0, climb=0, straight=0;
    /* edges, not cells: the leg owns everything up to the cell the next leg starts on */
    for(let k=start;k<i-1;k++){
      const u=cells[k], v=cells[k+1];
      cost+=edgeCost(u,v);
      straight+=miles(u,v);
      if(C.riv[v]&&!C.riv[u]) fords++;
      climb+=Math.max(0,C.h[v]-C.h[u]);
    }
    out.push({
      from:cells[start], to:cur,
      biome:A.biomeOf(cur).name, state:A.stateOf(cur),
      cost:cost, miles:straight, fords:fords, climb:climb,
      cells:i-start
    });
    start=i-1;
    if(last) break;
  }
  return out.filter(l=>l.cost>0);
}

A.route={ edgeCost:edgeCost, miles:miles, from:from, fromMany:fromMany, find:route };
})();
</script>
<script>
/* ===================================================================================
   Adrinem — plate renderer. Draws the world onto one SVG sheet and owns the view
   state (pan, zoom, fly-to) and the hit testing.

   The ground is 3,817 cells, which is far too many to give each one an element and
   still pan smoothly. Instead every cell's outline is turned into a path fragment
   once, and the layer is drawn as one path per colour — nine or twenty elements
   rather than thousands. Nothing is bound to the DOM, so a tap is resolved back to a
   cell arithmetically, by nearest site, which is what a Voronoi cell means anyway.
   =================================================================================== */
(function(){
"use strict";
const A=window.ADRINEM=window.ADRINEM||{};
const C=A.cells, M=A.meta, D=A.data, PAL=A.palette;
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const n=document.createElementNS(SVGNS,t);
  for(const k in a) if(a[k]!=null) n.setAttribute(k,a[k]); return n;};
const clear=g=>{ while(g.firstChild) g.removeChild(g.firstChild); };

/* the map frame is already north-up and square, so the projection is the identity;
   it stays a function so the rest of the file reads like the survey sheet's does */
const PX=x=>x, PY=y=>y;

/* ---- cell outlines, cut once ------------------------------------------------------ */
let DPATH=null;
function outlines(){
  if(DPATH) return DPATH;
  A.build();
  DPATH=new Array(A.count);
  for(let i=0;i<A.count;i++){
    const p=A.polyOf(i);
    let s="";
    for(let k=0;k<p.length;k+=2) s+=(k?"L":"M")+p[k].toFixed(1)+" "+p[k+1].toFixed(1);
    DPATH[i]=s+"Z";
  }
  return DPATH;
}

/* ---- how the ground is coloured, per mode ----------------------------------------- */
const DEPTH=[PAL.deep,PAL.shelf,"#A5B8C0"];
function waterColour(i){ return DEPTH[Math.min(2,Math.floor(C.h[i]/7))]; }

let catchIx=null;                       /* market cell -> index into the ramp */
function catchmentIndex(){
  if(catchIx) return catchIx;
  catchIx=new Map();
  D.markets.forEach((m,n)=>catchIx.set(m.cell,n));
  return catchIx;
}

let popMax=0; for(let i=0;i<A.count;i++) if(C.pop[i]>popMax) popMax=C.pop[i];
let costMax=0; for(let i=0;i<A.count;i++) if(C.cost[i]>costMax) costMax=C.cost[i];

const MODES={
  biome:{ label:"BIOME", colour:i=>PAL.biome(A.biomeOf(i).name) },
  relief:{ label:"RELIEF", colour:i=>
    PAL.step(PAL.RELIEF,(C.h[i]-M.seaLevel)/(100-M.seaLevel)) },
  realm:{ label:"REALMS", colour:i=>PAL.realm(A.stateOf(i)) },
  culture:{ label:"PEOPLES", colour:i=>PAL.culture(A.cultureOf(i)) },
  catchment:{ label:"CATCHMENTS", colour:i=>{
    const ix=catchmentIndex().get(C.mkt[i]);
    return ix===undefined?"url(#beyond)":PAL.catchment(ix); } },
  supply:{ label:"SUPPLY", colour:i=>
    C.cost[i]<0?"url(#beyond)":PAL.step(PAL.SUPPLY,Math.min(1,C.cost[i]/costMax)) },
  density:{ label:"POPULATION", colour:i=>
    C.pop[i]<=0?"#EFEADA":PAL.step(PAL.DENSITY,Math.sqrt(C.pop[i]/popMax)) },
  habitability:{ label:"HABITABILITY", colour:i=>
    PAL.step(PAL.HAB,A.biomeOf(i).hab/100) }
};

/* =================================================================================== */
function init(opts){
  const svg=opts.svg, stage=opts.stage;
  const gRoot=el("g",{}); svg.appendChild(gRoot);
  const L={};
  ["sea","ground","reach","grat","river","march","coast","road","route",
   "burg","pin","halo","lab"].forEach(k=>{L[k]=el("g",{}); gRoot.appendChild(L[k]);});

  const defs=el("defs",{});
  defs.innerHTML=
    '<pattern id="beyond" width="8" height="8" patternUnits="userSpaceOnUse" '+
    'patternTransform="rotate(45)"><rect width="8" height="8" fill="#E6E2D2"/>'+
    '<line x1="0" y1="0" x2="0" y2="8" stroke="#8A8474" stroke-width="1.1" '+
    'stroke-opacity="0.5"/></pattern>';
  svg.insertBefore(defs,gRoot);

  /* --- the sea, and the frame the plate is cut to --- */
  const F=A.frame;
  L.sea.appendChild(el("rect",{x:F.x0,y:F.y0,width:F.x1-F.x0,height:F.y1-F.y0,
    fill:PAL.sea}));
  /* the plate is cut to a ruled edge, the way an atlas sheet is */
  L.coast.appendChild(el("rect",{x:F.x0,y:F.y0,width:F.x1-F.x0,height:F.y1-F.y0,
    fill:"none",stroke:"#2C2C2A","stroke-width":1.6,"stroke-opacity":.55}));

  /* --- graticule, off the lon/lat the export carried --- */
  (function(){
    const g=L.grat, ink="#2C2C2A";
    const xOf=lon=>(lon-M.lonW)/M.lonPer, yOf=lat=>(lat-M.latN)/M.latPer;
    for(let lon=-180;lon<=180;lon+=15){
      const x=xOf(lon); if(x<F.x0||x>F.x1) continue;
      g.appendChild(el("line",{x1:x,y1:F.y0,x2:x,y2:F.y1,stroke:ink,
        "stroke-width":.4,"stroke-opacity":.16,"stroke-dasharray":"3 5"}));
      const t=el("text",{x:x,y:F.y0,dy:"1.4em",class:"grat"});
      t.textContent=(lon<0?Math.abs(lon)+"°W":lon>0?lon+"°E":"0°"); g.appendChild(t);
    }
    for(let lat=-90;lat<=90;lat+=15){
      const y=yOf(lat); if(y<F.y0||y>F.y1) continue;
      g.appendChild(el("line",{x1:F.x0,y1:y,x2:F.x1,y2:y,stroke:ink,
        "stroke-width":.4,"stroke-opacity":.16,"stroke-dasharray":"3 5"}));
      const t=el("text",{x:F.x0,y:y,dx:"0.6em",dy:"-0.4em",class:"grat"});
      t.textContent=(lat<0?Math.abs(lat)+"°S":lat>0?lat+"°N":"0°"); g.appendChild(t);
    }
  })();

  /* --- the ground, one path per colour --- */
  let mode="biome";
  function paintGround(){
    const d=outlines(), by=new Map();
    const colour=MODES[mode].colour;
    for(let i=0;i<A.count;i++){
      const c=A.isLand(i)?colour(i):waterColour(i);
      const cur=by.get(c); if(cur) cur.push(d[i]); else by.set(c,[d[i]]);
    }
    clear(L.ground);
    by.forEach((frags,c)=>L.ground.appendChild(
      el("path",{d:frags.join(""),fill:c,"shape-rendering":"crispEdges"})));
  }

  /* --- the lines the diagram gives us: coast, marches, rivers --- */
  (function(){
    const coast=[], realm=[], prov=[];
    A.edges().forEach(e=>{
      const seg="M"+e.x1.toFixed(1)+" "+e.y1.toFixed(1)+
                "L"+e.x2.toFixed(1)+" "+e.y2.toFixed(1);
      if(e.b<0){ if(A.isLand(e.a)) coast.push(seg); return; }
      const la=A.isLand(e.a), lb=A.isLand(e.b);
      if(la!==lb){ coast.push(seg); return; }
      if(!la) return;
      if(C.st[e.a]!==C.st[e.b]) realm.push(seg);
      else if(C.pv[e.a]!==C.pv[e.b]) prov.push(seg);
    });
    L.march.appendChild(el("path",{d:prov.join(""),fill:"none",stroke:"#5A564A",
      "stroke-width":.5,"stroke-opacity":.4,"stroke-dasharray":"2.5 2.5",class:"prov"}));
    L.march.appendChild(el("path",{d:realm.join(""),fill:"none",stroke:"#4A463C",
      "stroke-width":1.15,"stroke-opacity":.75,class:"realm"}));
    L.coast.appendChild(el("path",{d:coast.join(""),fill:"none",stroke:"#3A4A52",
      "stroke-width":.85,"stroke-opacity":.9,"stroke-linecap":"round"}));

    /* rivers, thickened by the flux they carry */
    const band=[[],[],[],[]];
    A.rivers().forEach(s=>{
      const b=s.flux>=260?3:s.flux>=110?2:s.flux>=40?1:0;
      band[b].push("M"+s.x1.toFixed(1)+" "+s.y1.toFixed(1)+
                   "L"+s.x2.toFixed(1)+" "+s.y2.toFixed(1));
    });
    band.forEach((segs,b)=>{ if(!segs.length) return;
      L.river.appendChild(el("path",{d:segs.join(""),fill:"none",stroke:PAL.river,
        "stroke-width":(0.7+b*0.75).toFixed(2),"stroke-opacity":.8,
        "stroke-linecap":"round"}));
    });
  })();

  /* --- the trade network --- */
  (function(){
    const R=A.roads, byCls=[[],[],[]];
    for(let k=0;k<R.a.length;k++){
      const a=R.a[k], b=R.b[k];
      byCls[R.cls[k]].push("M"+C.x[a].toFixed(1)+" "+C.y[a].toFixed(1)+
                           "L"+C.x[b].toFixed(1)+" "+C.y[b].toFixed(1));
    }
    const spec=[["trail",PAL.road.trail,.7,"2 2.4"],["road",PAL.road.road,1.35,null],
                ["trunk",PAL.road.trunk,2.3,null]];
    spec.forEach(([name,col,w,dash],ix)=>{
      if(!byCls[ix].length) return;
      L.road.appendChild(el("path",{d:byCls[ix].join(""),fill:"none",stroke:col,
        "stroke-width":w,"stroke-opacity":.85,"stroke-linecap":"round",
        "stroke-dasharray":dash,class:"rd rd-"+name}));
    });
  })();

  /* --- settlements --- */
  const tierOf=p=>p>=800000?1:p>=300000?2:p>=100000?3:4;
  function paintBurgs(){
    clear(L.burg); clear(L.lab);
    /* realm names first, so a burg label never sits under one */
    const acc=new Map();
    for(let i=0;i<A.count;i++){
      if(!A.isLand(i)||!C.st[i]) continue;
      const w=C.pop[i]+1, r=acc.get(C.st[i])||{x:0,y:0,w:0,n:0};
      r.x+=C.x[i]*w; r.y+=C.y[i]*w; r.w+=w; r.n++; acc.set(C.st[i],r);
    }
    let widest=1; acc.forEach(r=>{ if(r.n>widest) widest=r.n; });
    acc.forEach((r,st)=>{
      /* a realm's name is set at a size its ground can carry, so Lecende does not
         shout as loudly as Asra */
      const k=Math.sqrt(r.n/widest);
      const t=el("text",{x:r.x/r.w,y:r.y/r.w,class:"realmlab g1",
        style:"font-size:"+(0.9+k*1.5).toFixed(2)+"em"});
      t.textContent=(D.states[st]||"").toUpperCase();
      L.lab.appendChild(t);
    });

    A.burgs.forEach(b=>{
      const i=b.cell, x=PX(C.x[i]), y=PY(C.y[i]), t=tierOf(b.pop);
      const mk=A.marketOf(i), port=A.portOf(i);
      const g=el("g",{class:"bg t"+t,style:"cursor:pointer"});
      const r=[0,4.4,3.4,2.6,1.9][t];
      if(mk) g.appendChild(el("circle",{cx:x,cy:y,r:r+2.6,fill:"none",
        stroke:"#2C2C2A","stroke-width":1,"stroke-opacity":.85}));
      if(port) g.appendChild(el("path",{d:`M${x-r-4.4} ${y} h${(r+4.4)*2}`,
        stroke:"#3A4A52","stroke-width":.9,"stroke-opacity":.75}));
      g.appendChild(el("circle",{cx:x,cy:y,r:r,fill:"#FAF9F5",stroke:"#2C2C2A",
        "stroke-width":1.1}));
      if(t<=2) g.appendChild(el("circle",{cx:x,cy:y,r:r*0.42,fill:"#2C2C2A"}));
      g.appendChild(el("circle",{cx:x,cy:y,r:Math.max(r+4,7),fill:"transparent"}));
      g.addEventListener("click",e=>{e.stopPropagation(); opts.onBurg&&opts.onBurg(b);});
      L.burg.appendChild(g);

      const lab=el("text",{x:x,y:y,dx:(r+3).toFixed(1),dy:"0.34em",
        class:"burglab g"+Math.min(3,t)});
      lab.textContent=b.name;
      L.lab.appendChild(lab);
    });
  }

  /* =========================== view state ========================================= */
  let sc=1,tx=0,ty=0;
  function apply(){
    gRoot.setAttribute("transform",`translate(${tx} ${ty}) scale(${sc})`);
    /* Labels and symbols are laid out in map space but sized in screen space, so a
       zoom moves them without inflating them. On a phone the whole world fits at
       about a quarter of the scale it does on a desk, and lettering held at a fixed
       number of screen pixels swamps it — so the type is eased down with the plate,
       the way a reduction of an atlas sheet sets its names smaller. */
    const k=Math.max(0.62,Math.min(1.15,Math.sqrt(sc/0.8)));
    L.lab.style.fontSize=(9*k/sc)+"px";
    L.grat.style.fontSize=(8*k/sc)+"px";
    L.pin.style.fontSize=(9*k/sc)+"px";
    svg.style.setProperty("--symk",(1/sc).toFixed(3));
    L.road.querySelectorAll(".rd").forEach(n=>{
      n.style.display=(n.classList.contains("rd-trail")&&sc<1.6)?"none":"";
    });
    L.march.querySelector(".prov").style.display=sc<1.3?"none":"";
    svg.querySelectorAll(".g1,.g2,.g3,.t1,.t2,.t3,.t4").forEach(n=>{
      const c=n.classList; let show=true;
      if(c.contains("g3")||c.contains("t4")) show=sc>=2.4;
      else if(c.contains("g2")||c.contains("t3")) show=sc>=1.2;
      n.style.display=show?"":"none";
    });
  }
  /* The plate is fitted into what is actually free: the header sits over the top and
     the control rail down the right, so centring on the raw viewport pushes the sheet
     under both. */
  const INSET={l:20,r:70,t:62,b:20};
  function fit(){
    const w=svg.clientWidth||innerWidth, h=svg.clientHeight||innerHeight;
    const availW=Math.max(80,w-INSET.l-INSET.r), availH=Math.max(80,h-INSET.t-INSET.b);
    const mw=F.x1-F.x0, mh=F.y1-F.y0;
    sc=Math.max(0.16,Math.min(3,Math.min(availW/mw,availH/mh)));
    tx=INSET.l+(availW-mw*sc)/2-F.x0*sc;
    ty=INSET.t+(availH-mh*sc)/2-F.y0*sc;
    apply();
  }
  function zoomAt(f,cx,cy){
    const ns=Math.max(0.16,Math.min(14,sc*f));
    const k=ns/sc; tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; sc=ns; apply();
  }
  function toMap(clientX,clientY){
    const r=svg.getBoundingClientRect();
    return [(clientX-r.left-tx)/sc,(clientY-r.top-ty)/sc];
  }
  let anim=null;
  function flyTo(x,y,target){
    const w=svg.clientWidth||innerWidth, h=svg.clientHeight||innerHeight;
    const ns=target||Math.max(sc,3);
    const nx=w/2-PX(x)*ns, ny=h/2-PY(y)*ns;
    const s0=sc,x0=tx,y0=ty,t0=performance.now(),dur=520;
    if(anim) cancelAnimationFrame(anim);
    (function stepTo(t){
      const k=Math.min(1,(t-t0)/dur), e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
      sc=s0+(ns-s0)*e; tx=x0+(nx-x0)*e; ty=y0+(ny-y0)*e; apply();
      if(k<1) anim=requestAnimationFrame(stepTo);
    })(t0);
  }

  /* --- selection --- */
  let halo=null;
  function highlight(cell){
    if(halo&&!halo.parentNode) halo=null;
    if(!halo){ halo=el("path",{fill:"none",stroke:"#C4472A","stroke-width":2,
      "stroke-opacity":.95,"vector-effect":"non-scaling-stroke"});
      L.halo.appendChild(halo); }
    halo.setAttribute("d",outlines()[cell]);
    halo.style.display="";
  }
  function clearHighlight(){ if(halo) halo.style.display="none"; }

  /* --- a found way --- */
  function drawRoute(cells){
    clear(L.route);
    if(!cells||cells.length<2) return;
    const d=cells.map((i,n)=>(n?"L":"M")+PX(C.x[i]).toFixed(1)+" "+PY(C.y[i]).toFixed(1)).join("");
    L.route.appendChild(el("path",{d:d,fill:"none",stroke:"#FAF9F5","stroke-width":4.4,
      "stroke-opacity":.75,"stroke-linejoin":"round","stroke-linecap":"round"}));
    L.route.appendChild(el("path",{d:d,fill:"none",stroke:"#7A3E8F","stroke-width":2.1,
      "stroke-linejoin":"round","stroke-linecap":"round"}));
    [cells[0],cells[cells.length-1]].forEach((i,n)=>
      L.route.appendChild(el("circle",{cx:PX(C.x[i]),cy:PY(C.y[i]),r:3.6,
        fill:n?"#7A3E8F":"#FAF9F5",stroke:"#7A3E8F","stroke-width":1.8})));
  }
  function clearRoute(){ clear(L.route); }

  /* --- a reach: everything within so many days of one place --- */
  function drawReach(dist,bands){
    clear(L.reach);
    if(!dist) return;
    const d=outlines(), buckets=bands.map(()=>[]);
    for(let i=0;i<A.count;i++){
      if(!A.isLand(i)||!isFinite(dist[i])) continue;
      const days=A.daysOf(dist[i]);
      for(let b=0;b<bands.length;b++)
        if(days<=bands[b]){ buckets[b].push(d[i]); break; }
    }
    buckets.forEach((frags,b)=>{
      if(!frags.length) return;
      L.reach.appendChild(el("path",{d:frags.join(""),fill:"#7A3E8F",
        "fill-opacity":(0.5-b*0.08).toFixed(3),"shape-rendering":"crispEdges"}));
    });
  }
  function clearReach(){ clear(L.reach); }

  /* --- the reader's own marks --- */
  function renderPins(pins){
    clear(L.pin);
    (pins||[]).forEach(p=>{
      const x=PX(p.x), y=PY(p.y);
      const g=el("g",{style:"cursor:pointer"});
      const sym=el("g",{class:"usym"});
      sym.appendChild(el("path",{d:`M${x} ${y} l-4.6 -7.4 a5.4 5.4 0 1 1 9.2 0 Z`,
        fill:"var(--mark)",stroke:"#FAF9F5","stroke-width":1.1,"stroke-linejoin":"round"}));
      sym.appendChild(el("circle",{cx:x,cy:y-9.4,r:1.9,fill:"#FAF9F5"}));
      sym.appendChild(el("circle",{cx:x,cy:y-6,r:13,fill:"transparent"}));
      g.appendChild(sym);
      const t=el("text",{x:x,y:y,dx:".8em",dy:"-0.9em",class:"ulab"});
      t.textContent=p.name; g.appendChild(t);
      g.addEventListener("click",e=>{e.stopPropagation(); opts.onPin&&opts.onPin(p);});
      L.pin.appendChild(g);
    });
  }

  /* --- pointer: pan, pinch, wheel --------------------------------------------------- */
  const ptrs=new Map(); let last=null,pd=0,moved=0;
  stage.addEventListener("pointerdown",e=>{
    stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    stage.classList.add("drag"); moved=0;
    if(ptrs.size===1) last={x:e.clientX,y:e.clientY};
    if(ptrs.size===2){const[a,b]=[...ptrs.values()];pd=Math.hypot(a.x-b.x,a.y-b.y);}
  });
  stage.addEventListener("pointermove",e=>{
    if(!ptrs.has(e.pointerId))return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1&&last){
      const dx=e.clientX-last.x, dy=e.clientY-last.y;
      moved+=Math.abs(dx)+Math.abs(dy);
      tx+=dx; ty+=dy; last={x:e.clientX,y:e.clientY}; apply();
    } else if(ptrs.size===2){
      const [a,b]=[...ptrs.values()], nd=Math.hypot(a.x-b.x,a.y-b.y);
      if(pd>0) zoomAt(nd/pd,(a.x+b.x)/2,(a.y+b.y)/2);
      pd=nd; moved+=6;
    }
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>
    stage.addEventListener(ev,e=>{ptrs.delete(e.pointerId);
      if(ptrs.size<2)pd=0; if(ptrs.size===0){last=null;stage.classList.remove("drag");}}));
  stage.addEventListener("wheel",e=>{e.preventDefault();
    zoomAt(Math.pow(0.9986,e.deltaY),e.clientX,e.clientY);},{passive:false});
  stage.addEventListener("click",e=>{
    if(moved>6) return;
    const [x,y]=toMap(e.clientX,e.clientY);
    opts.onGround&&opts.onGround(A.cellAt(x,y),x,y,e);
  });
  addEventListener("resize",fit);

  /* --- go --- */
  paintGround(); paintBurgs(); fit();

  return {
    layers:L, fit:fit, apply:apply, zoomAt:zoomAt, flyTo:flyTo, toMap:toMap,
    highlight:highlight, clearHighlight:clearHighlight,
    drawRoute:drawRoute, clearRoute:clearRoute,
    drawReach:drawReach, clearReach:clearReach,
    renderPins:renderPins,
    modes:MODES,
    setMode(m){ if(!MODES[m]) return; mode=m; paintGround(); },
    get mode(){ return mode; },
    setLayer(name,on){ const g=L[name]; if(g) g.style.display=on?"":"none"; },
    get scale(){ return sc; }
  };
}

A.map={init:init, MODES:MODES};
})();
</script>
<script>
/* ===================================================================================
   Adrinem — the city plate. A burg on the world sheet is one point; this generates
   the ground under it.

   Nothing here is drawn by hand. The plan is derived from what the export actually
   says about the site, in this order:

     the sea lies north-east          cell 461 touches exactly one water cell, 463
     the haven is enclosed            harbour value 1 — one sea contact, so one mouth
     the ground rises south-east      h 37 at the site, 38-39 inland at bearing 105-112
     the marsh is south               cell 551, Wetland, bearing 112
     the open coast is north-west     cell 460, harbour value 5 — five sea contacts
     no river anywhere                r=0 on the site and on every neighbour
     the land trade arrives south-east  the road to Bodmouthton, bearing 60, 11 uses
     and west                         the trail to 462, bearing -177, 2 uses
     the sea trade is the city        Cass'tow, 561,068 people in Oem'rek's own realm,
                                      has no overland way to it. Nor do P'ivka or
                                      S'ven. The harbour is not an amenity here.

   Everything below follows from those lines plus the burg's population. Where a rule
   had to be chosen rather than read — how many people to a hectare, how wide a quay,
   how far a waggon goes in a day — the figure is written down at the top of the
   section that uses it, so it can be argued with.
   =================================================================================== */
(function(){
"use strict";
const A=window.ADRINEM=window.ADRINEM||{};
const C=A.cells, M=A.meta;

/* ---- a seeded generator, so the city is the same city every time ------------------ */
function rng(seed){
  let s=seed>>>0||1;
  return function(){ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; };
}
const TAU=Math.PI*2, D2R=Math.PI/180;
const vec=(deg,len)=>[Math.cos(deg*D2R)*len,Math.sin(deg*D2R)*len];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const mul=(a,k)=>[a[0]*k,a[1]*k];
const len=a=>Math.hypot(a[0],a[1]);
const norm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l];};
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const polyArea=p=>{let s=0;for(let i=0;i<p.length;i++){const j=(i+1)%p.length;
  s+=p[i][0]*p[j][1]-p[j][0]*p[i][1];} return Math.abs(s)/2;};
const centroid=p=>{let x=0,y=0;p.forEach(q=>{x+=q[0];y+=q[1];});
  return [x/p.length,y/p.length];};

/* ===================================================================================
   1. THE SITE — read off the world sheet, not chosen
   =================================================================================== */
function siteOf(cell){
  const burg=A.burgOf(cell), port=A.portOf(cell), market=A.marketOf(cell);
  const nb=A.neighboursOf(cell);
  const bearingTo=j=>Math.atan2(C.y[j]-C.y[cell],C.x[j]-C.x[cell])/D2R;

  /* the sea: the mean bearing of this cell's water neighbours */
  const water=nb.filter(j=>!A.isLand(j));
  let sx=0,sy=0; water.forEach(j=>{const v=vec(bearingTo(j),1); sx+=v[0]; sy+=v[1];});
  const seaBearing=water.length?Math.atan2(sy,sx)/D2R:null;

  /* and the land, the same way. This is not the opposite of the sea bearing on a
     real coast, and the difference is what decides which shore of the haven the city
     stands on: the one with the hinterland behind it. */
  let lx=0,ly=0;
  nb.filter(j=>A.isLand(j)).forEach(j=>{const v=vec(bearingTo(j),1); lx+=v[0]; ly+=v[1];});
  const landBearing=(lx||ly)?Math.atan2(ly,lx)/D2R:(seaBearing!=null?seaBearing+180:null);

  /* the land trade: every road segment that touches the cell, with its bearing */
  const R=A.roads, roads=[];
  for(let k=0;k<R.a.length;k++){
    if(R.a[k]!==cell&&R.b[k]!==cell) continue;
    const other=R.a[k]===cell?R.b[k]:R.a[k];
    roads.push({cell:other, cls:["trail","road","trunk"][R.cls[k]], uses:R.uses[k],
      bearing:bearingTo(other), to:(A.burgOf(other)||{}).name||null});
  }
  roads.sort((a,b)=>b.uses-a.uses);

  /* The next cell along a trunk is usually empty ground, so a road named after it has
     no name. Follow it, always taking the busiest way on, until it reaches somewhere
     with a name — which is what the road is called. */
  roads.forEach(r=>{
    let prev=cell, cur=r.cell, guard=0;
    while(guard++<40){
      const b=A.burgOf(cur);
      if(b&&cur!==cell){ r.leadsTo=b.name; r.leadsToCell=cur; r.leadsIn=A.stateOf(cur);
        r.leadsHops=guard; break; }
      let best=-1,bu=-1;
      for(let k=0;k<R.a.length;k++){
        if(R.a[k]!==cur&&R.b[k]!==cur) continue;
        const o=R.a[k]===cur?R.b[k]:R.a[k];
        if(o===prev) continue;
        if(R.uses[k]>bu){ bu=R.uses[k]; best=o; }
      }
      if(best<0) break;
      prev=cur; cur=best;
    }
    if(!r.to) r.to=r.leadsTo||null;
  });

  /* the lie of the land: where it rises, where the marsh is, where the coast is open */
  let rise=null, marsh=null, exposed=null;
  nb.forEach(j=>{
    if(!A.isLand(j)) return;
    if(!rise||C.h[j]>C.h[rise]) rise=j;
    if(A.biomeOf(j).name==="Wetland"&&(!marsh||C.h[j]<C.h[marsh])) marsh=j;
    if(!exposed||C.hrb[j]>C.hrb[exposed]) exposed=j;
